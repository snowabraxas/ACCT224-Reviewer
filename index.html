<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACCT224 Reviewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDEA; --paper:#FBFCFA; --ink:#17222D; --muted:#5A6570; --rule:#D3DDD7; --rule2:#E6ECE8;
  --field:#FFFFFF; --fieldline:#B9C5BE;
  --ok:#2E7A47; --okbg:#E3F2E8; --bad:#B3261E; --badbg:#FBE7E5;
  --warn:#8A6400; --warnbg:#FDF3D7;
  --w2:#1E6E8C; --w3:#6A4AA5; --w4:#A9680C; --w5:#B23452; --w6:#1F7A4D; --w7:#3B4FA6; --w8:#B6552C;
  --w2s:#DCEDF3; --w3s:#EAE3F5; --w4s:#F6EBD9; --w5s:#F6E0E5; --w6s:#DFF1E6; --w7s:#E2E5F5; --w8s:#F3E3D8;
  --shadow:0 1px 0 rgba(23,34,45,.06),0 8px 24px -12px rgba(23,34,45,.25);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11171C; --paper:#1A2229; --ink:#E4EAEE; --muted:#9AA6B0; --rule:#2C3842; --rule2:#232D35;
    --field:#121A20; --fieldline:#3A4853;
    --ok:#6FCB8E; --okbg:#173325; --bad:#F08A80; --badbg:#3A1D1B;
    --warn:#E8C45C; --warnbg:#3A3015;
    --w2:#5DB7D8; --w3:#AC90E4; --w4:#E4A64C; --w5:#EE7C95; --w6:#4FBE86; --w7:#9AA7EA; --w8:#E8926B;
    --w2s:#16323D; --w3s:#2A2340; --w4s:#382A14; --w5s:#3B1C25; --w6s:#13301F; --w7s:#242B4A; --w8s:#3A2418;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171C; --paper:#1A2229; --ink:#E4EAEE; --muted:#9AA6B0; --rule:#2C3842; --rule2:#232D35;
  --field:#121A20; --fieldline:#3A4853;
  --ok:#6FCB8E; --okbg:#173325; --bad:#F08A80; --badbg:#3A1D1B;
  --warn:#E8C45C; --warnbg:#3A3015;
  --w2:#5DB7D8; --w3:#AC90E4; --w4:#E4A64C; --w5:#EE7C95; --w6:#4FBE86; --w7:#9AA7EA; --w8:#E8926B;
  --w2s:#16323D; --w3s:#2A2340; --w4s:#382A14; --w5s:#3B1C25; --w6s:#13301F; --w7s:#242B4A; --w8s:#3A2418;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--wc,var(--w2));outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 64px}

/* header */
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:clamp(1.5rem,3.4vw,2.1rem);line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.testseg{margin:0 0 10px}
.testseg button{font-size:.92rem}
.overview{--wc:var(--w2);background:var(--paper);border-left:4px solid var(--wc);border-radius:0 10px 10px 0;box-shadow:var(--shadow);margin:0 0 16px;padding:2px 2px}
.overview summary{cursor:pointer;list-style:none;font-weight:700;padding:10px 14px;color:var(--wc);display:flex;align-items:center;gap:8px}
.overview summary::-webkit-details-marker{display:none}
.overview summary::before{content:"\25B8";display:inline-block;transition:transform .15s}
.overview[open] summary::before{transform:rotate(90deg)}
.overview .ov-body{padding:0 16px 14px;max-width:78ch;color:var(--ink)}
.overview .ov-body p{margin:0 0 8px}
.overview .ov-body p:last-child{margin-bottom:0}
.overview .ov-h{font-weight:700;color:var(--wc)}
.overview .ov-note{font-size:.9rem;color:var(--muted);font-style:italic}
.ghost{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.ghost:hover{color:var(--ink)}

/* binder tabs */
.tabs{display:flex;gap:4px;padding-left:14px;position:relative;z-index:2;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{--wc:var(--w2);flex:0 0 auto;border:0;cursor:pointer;background:var(--wc);color:#fff;border-radius:10px 10px 0 0;padding:9px 16px 10px;text-align:left;min-width:150px;opacity:.55;transform:translateY(5px);transition:transform .15s,opacity .15s}
:root[data-theme="dark"] .tab{color:#0E141A}
.tab:hover{opacity:.8;transform:translateY(2px)}
.tab[aria-selected="true"]{opacity:1;transform:none}
.tab .wk{display:block;font-weight:800;font-size:1.05rem;line-height:1.1}
.tab .tp{display:block;font-size:.78rem;line-height:1.25;opacity:.95}
.tab .bar{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.35);margin-top:7px;overflow:hidden}
.tab .bar i{display:block;height:100%;background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab{color:#0E141A} :root:not([data-theme="light"]) .tab .bar{background:rgba(0,0,0,.25)} :root:not([data-theme="light"]) .tab .bar i{background:#0E141A}}
:root[data-theme="dark"] .tab .bar{background:rgba(0,0,0,.25)} :root[data-theme="dark"] .tab .bar i{background:#0E141A}

/* mixed controls */
.mixbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{--wc:var(--w2);border:2px solid var(--wc);background:transparent;color:var(--wc);border-radius:999px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--wc);color:var(--paper)}
.mixbar .spacer{flex:1}
.count{color:var(--muted);font-size:.92rem}

/* sheet */
.sheet{--wc:var(--w2);background:var(--paper);border-radius:6px 12px 12px 12px;box-shadow:var(--shadow);position:relative;border-top:6px solid var(--wc);padding:18px 18px 24px 34px;
  background-image:linear-gradient(to right,transparent 22px,var(--wc) 22px,var(--wc) 25px,transparent 25px);}
.sheet.mixed{border-radius:12px}
.pnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.pn{border:1px solid var(--rule);background:var(--field);border-radius:7px;min-width:36px;height:34px;padding:0 8px;cursor:pointer;font-weight:600;position:relative;color:var(--muted)}
.pn[aria-current="true"]{border-color:var(--wc);color:var(--wc);box-shadow:inset 0 0 0 1px var(--wc)}
.pn.done{background:var(--wcs,var(--okbg));color:var(--ok);border-color:var(--ok)}
.pn.qz{border-style:dashed;border-width:1.5px}
.pn.fl::after{content:"\2691";position:absolute;top:-9px;right:-6px;font-size:.8rem;line-height:1;color:var(--paper);background:var(--ink);border-radius:999px;padding:2px 3px}
.flag{margin-left:auto;border:1.5px solid var(--rule);background:var(--field);color:var(--muted);border-radius:999px;padding:4px 12px;font-weight:600;font-size:.85rem;cursor:pointer}
.flag[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.flag.notebtn{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.flag.notebtn[aria-expanded="true"]{background:var(--warn);border-color:var(--warn);color:var(--paper)}
.flag[data-flag]{border-color:var(--bad);color:var(--bad);background:var(--badbg)}
.flag[data-flag][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.chip.flagchip{--wc:var(--ink)}
.notebtn{margin-left:auto}
.notebtn + .flag{margin-left:0}
.note-area{margin:12px 0 4px;max-width:78ch;border-left:4px solid var(--wc);background:var(--wcs);border-radius:0 8px 8px 0;padding:10px 12px}
.note-area[hidden]{display:none}
.note-area label{display:block;font-weight:700;font-size:.85rem;margin-bottom:4px}
.note-area textarea{width:100%;border:1.5px solid var(--fieldline);border-radius:7px;background:var(--field);padding:8px 10px;font:inherit;resize:vertical;min-height:72px}
.note-saved{font-size:.78rem;color:var(--muted);min-height:1em;margin-top:3px}
.pn.nt::before{content:"\270E";position:absolute;bottom:-8px;right:-6px;font-size:.72rem;line-height:1;background:var(--wc);color:var(--paper);border-radius:999px;padding:2px 3px}
.notesp{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:18px}
.notesp[hidden]{display:none}
.notesp h3{margin:0 0 4px;font-size:1.1rem}
.notesp .count{margin:0 0 8px}
.ni{border-top:1px solid var(--rule);padding:10px 0;display:grid;gap:6px}
.ni .nt-head{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.ni .nt-head b{font-weight:700}
.ni .nt-text{white-space:pre-wrap;margin:0;max-width:78ch;border-left:3px solid var(--wc);padding-left:10px}
.ni button{justify-self:start}
.legend{align-self:center;font-size:.78rem;color:var(--muted);margin-left:6px}
.pn.part{box-shadow:inset 0 -4px 0 var(--wc)}
button:disabled{opacity:.35;cursor:default}
.phead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:6px}
.tag{display:inline-block;background:var(--wc);color:var(--paper);font-weight:700;font-size:.78rem;border-radius:5px;padding:2px 8px;white-space:nowrap}
h2{font-size:1.35rem;line-height:1.25;margin:0;font-weight:800;letter-spacing:-.01em}
.src{color:var(--muted);font-size:.85rem}
.given{margin:14px 0 6px;max-width:78ch}
.given p{margin:0 0 10px}
.given ul{margin:0 0 10px;padding-left:20px}
.tw{overflow-x:auto;margin:6px 0 14px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:.9rem;min-width:min(100%,420px)}
th,td{padding:5px 10px;border-bottom:1px solid var(--rule2);text-align:left;vertical-align:top}
th{font-weight:700;border-bottom:2px solid var(--rule);background:var(--wcs)}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:1.5px solid var(--ink)}
table.ws td.op,table.ws th.op{text-align:center;color:var(--muted);padding:5px 4px;width:1%}
table.ws td.bl{color:var(--muted)}
input.scratch{border:0;border-bottom:1.5px dashed var(--fieldline);background:transparent;color:inherit;font:inherit;
  padding:1px 4px;text-align:right;border-radius:0;min-width:44px;max-width:150px}
input.scratch:focus{outline:none;border-bottom-color:var(--wc);background:var(--wcs)}
input.scratch:not(:placeholder-shown){border-bottom-style:solid}
table.ws td.fcell{padding:3px 8px}
.fldin{display:inline-flex;flex-direction:column;vertical-align:middle;min-width:0;max-width:170px;text-align:left}
.fldin .inp{min-width:86px}
.fldin .inp input{padding:4px 7px}
.fldin .inp select{padding:4px 7px;min-width:130px}
.fldin .fb{font-size:.72rem;min-height:0;line-height:1.3;margin-top:2px;white-space:nowrap;text-align:right}
.fldin .fb:empty{display:none}
.calc .fldin{margin:0 2px}
.fields:empty{display:none}
.calc{margin:6px 0 12px;padding:10px 12px;background:var(--wcs);border-radius:8px;font-size:.92rem}
.calc div{padding:3px 0;font-variant-numeric:tabular-nums}
.mx{font-family:"Cambria Math",Cambria,"STIX Two Math","STIX Two Text","Times New Roman",serif;font-size:1.08em;line-height:1.55}
.mx i{font-style:italic}
.mx .fr{display:inline-flex;flex-direction:column;vertical-align:middle;margin:0 .14em;text-align:center}
.mx .fr>.nu{border-bottom:1.3px solid currentColor;padding:0 .22em .2em;line-height:1.35}
.mx .fr>.de{padding:.2em .22em 0;line-height:1.35}
.mx input.scratch{border:1px dashed var(--fieldline);border-radius:4px;padding:0 4px;margin:1px 2px;height:1.5em;
  vertical-align:middle;background:transparent;text-align:center;font-size:.88em;max-width:7em;min-width:2.6em}
.mx input.scratch:not(:placeholder-shown){border-style:solid}
.mx input.scratch:focus{border-color:var(--wc);background:var(--wcs)}
.mx .rc input.scratch{vertical-align:baseline}
.mx .rt{display:inline-flex;align-items:stretch;vertical-align:middle;position:relative;margin:0 .06em}
.mx .rt.rti{padding-left:.34em}
.mx .rt>.ri{position:absolute;left:0;top:.08em;font-size:.62em;line-height:1}
.mx .rs{display:flex;width:.72em;flex:none}
.mx .pl{display:flex;width:.42em;flex:none}
.mx .rs svg,.mx .pl svg{width:100%;height:100%;overflow:visible}
.mx .rs path,.mx .pl path{fill:none;stroke:currentColor;stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.mx .rc{border-top:1.3px solid currentColor;padding:.14em .2em 0 .1em}
.mx .pa{display:inline-flex;align-items:stretch;vertical-align:middle}
.mx .sp{font-size:.72em;vertical-align:super;line-height:1}
.mx .sp .fr{margin:0 .04em}
.mx .pw{display:inline-flex;align-items:flex-start;vertical-align:baseline;margin-right:.03em}
.mx .pw>.pb{margin-top:.35em}
.mx .pw.pwf>.pb{margin-top:1.1em}
.mx .pe{font-size:.68em;line-height:1.15;margin-left:.06em}
.mx .pe .fr>.nu{padding-bottom:.08em}.mx .pe .fr>.de{padding-top:.08em}
.ln .mx{font-size:1.05em}
.partgiven{margin:0 0 12px}
.parts{margin-top:10px;border-top:2px solid var(--rule)}
.part{padding:16px 0 14px;border-bottom:1px dashed var(--rule)}
.q{margin:0 0 10px;font-weight:600;max-width:78ch}
.q b.pl{color:var(--wc);margin-right:6px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.fld label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px;line-height:1.3}
.inp{display:flex;align-items:stretch;border:1.5px solid var(--fieldline);border-radius:7px;background:var(--field);overflow:hidden}
.inp span{display:flex;align-items:center;padding:0 8px;color:var(--muted);font-size:.85rem;background:var(--rule2)}
.inp input,.inp select{border:0;background:transparent;padding:7px 9px;width:100%;min-width:0;text-align:right;outline:none}
.inp select{text-align:left;cursor:pointer}
.inp:focus-within{border-color:var(--wc);box-shadow:0 0 0 2px var(--wcs)}
.fld.ok .inp{border-color:var(--ok);background:var(--okbg)}
.fld.bad .inp{border-color:var(--bad);background:var(--badbg)}
.fb{font-size:.8rem;min-height:1.1em;margin-top:2px}
.fld.ok .fb{color:var(--ok)} .fld.bad .fb{color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{border:0;background:var(--wc);color:var(--paper);font-weight:700;border-radius:7px;padding:8px 14px;cursor:pointer}
.btn2{border:1.5px solid var(--wc);background:transparent;color:var(--wc);font-weight:600;border-radius:7px;padding:7px 12px;cursor:pointer}
.steps{display:none;margin-top:12px;background:var(--wcs);border-radius:8px;padding:12px 14px;font-size:.92rem;max-width:80ch}
.steps.open{display:block}
.fx{display:none;margin-top:12px;border:1.5px solid var(--wc);border-radius:8px;padding:10px 14px;font-size:.92rem;max-width:80ch;background:var(--field)}
.fx.open{display:block}
.fx .ln{display:grid;grid-template-columns:minmax(150px,1fr) 2.2fr;gap:2px 14px;padding:4px 0;border-bottom:1px solid var(--rule2)}
.fx .ln:last-child{border-bottom:0}
.fx .ln b{font-weight:600;color:var(--wc)}
.xtag{display:inline-block;border:1.5px solid var(--muted);color:var(--muted);font-weight:600;font-size:.75rem;border-radius:5px;padding:1px 7px}
@media (max-width:600px){.fx .ln{grid-template-columns:1fr}}
.steps .ln{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr;gap:2px 14px;padding:3px 0;border-bottom:1px solid color-mix(in srgb,var(--wc) 18%,transparent)}
.steps .ln:last-child{border-bottom:0}
.steps .ln b{font-weight:600}
.steps p{margin:6px 0}
.steps .note{color:var(--muted);font-size:.85rem}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.foot .btn{min-width:130px}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.overall{font-size:.85rem;color:var(--muted)}
@media (max-width:600px){
  .wrap{padding:14px 10px 56px}
  .sheet{padding:14px 12px 20px 26px;background-image:linear-gradient(to right,transparent 14px,var(--wc) 14px,var(--wc) 17px,transparent 17px)}
  .tab{min-width:118px;padding:8px 12px 9px}
  .fields{grid-template-columns:1fr 1fr}
  .steps .ln{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>ACCT224 Reviewer</h1>
      <p class="sub">In-class problems and Connect quiz problems from Modules 2 to 8, rebuilt for practice. Type your answer, check it, then open the worked steps.</p>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Practice mode">
        <button id="mWeek" aria-pressed="true">Week by week</button>
        <button id="mMix" aria-pressed="false">Mixed practice</button>
      </div>
      <button class="ghost" id="notesBtn" aria-expanded="false">My notes</button>
      <button class="ghost" id="reset" title="Clear all saved answers">Reset progress</button>
    </div>
  </header>

  <section class="notesp" id="notesPanel" hidden aria-label="My notes"></section>
  <div id="weekUI">
    <div class="seg testseg" role="group" aria-label="Test coverage" id="testseg"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <details class="overview" id="overview"></details>
  </div>
  <div id="mixUI" hidden>
    <div class="mixbar">
      <span class="count">Include:</span>
      <span id="chips" style="display:contents"></span>
      <span class="spacer"></span>
      <button class="ghost" id="shuffle">Shuffle again</button>
    </div>
  </div>

  <main class="sheet" id="sheet"></main>
  <p class="overall"><span id="overall"></span> <span id="sync"></span></p>
</div>

<script>
/* ---------- helpers for building given-data tables ---------- */
const isNum = s => typeof s === 'string' && /^[\s$(\-–+]*[\d.,]+[%)x×]*\s*(days|times|units)?$/.test(s.trim());
function tb(head, rows, totRows){
  totRows = totRows || [];
  let h = '<div class="tw"><table>';
  if (head) h += '<thead><tr>' + head.map((c,i)=>`<th class="${i&&isNum('1')?'n':''}">${c}</th>`).join('') + '</tr></thead>';
  h += '<tbody>' + rows.map((r,ri)=>`<tr class="${totRows.includes(ri)?'tot':''}">` + r.map((c,i)=>`<td class="${i>0 && (isNum(String(c))||c==='') ?'n':''}">${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
  return h;
}
const OPS = {'+':1,'\u2212':1,'\u2013':1,'-':1,'\u00d7':1,'\u00f7':1,'=':1};
function wst(head, rows, totRows){
  totRows = totRows || [];
  const cell = (c, tag) => {
    const t = String(c).trim();
    let cls = '';
    if (OPS[t]) cls = 'op';
    else if (t === '') cls = 'n';
    else if (t.indexOf('{{') >= 0) cls = 'n fcell';
    else if (t.indexOf('__') >= 0) cls = 'n bl';
    else if (isNum(t)) cls = 'n';
    return `<${tag} class="${cls}">${c}</${tag}>`;
  };
  let h = '<div class="tw"><table class="ws">';
  if (head) h += '<thead><tr>' + head.map(c=>cell(c,'th')).join('') + '</tr></thead>';
  h += '<tbody>' + rows.map((r,ri)=>`<tr class="${totRows.includes(ri)?'tot':''}">` + r.map(c=>cell(c,'td')).join('') + '</tr>').join('') + '</tbody></table></div>';
  return h;
}
/* ---------- handout-style formula rendering (Test 2) ----------
   Turns linear notation ("I ÷ P × 365 ÷ d", "√( 2 × S × O ÷ C )") into stacked
   fractions, radicals and superscripts like the professor's slides.

const MX_OPS = '=+−×÷^√∛∜()[]';
function mxTok(src){
  const t=[]; let buf='';
  const flush=()=>{ const v=buf.trim(); if(v) t.push({k:'a',v}); buf=''; };
  for(let i=0;i<src.length;i++){
    const ch=src[i];
    if(ch==='(' && i>0 && /[A-Za-z]/.test(src[i-1])){            // f(date), d(date)
      let d=0,j=i; for(;j<src.length;j++){ if(src[j]==='(') d++; else if(src[j]===')'){ d--; if(!d) break; } }
      buf+=src.slice(i,j+1); i=j; continue;
    }
    if(ch==='ⁿ' && src[i+1]==='√'){ flush(); t.push({k:'o',v:'n√'}); i++; continue; }
    if(MX_OPS.indexOf(ch)>=0){ flush(); t.push({k:'o',v:ch}); continue; }
    buf+=ch;
  }
  flush(); return t;
}
function mxParse(tk){
  let i=0;
  const is=v=>tk[i]&&tk[i].k==='o'&&tk[i].v===v;
  const eq=()=>{ const c=[add()]; while(is('=')){ i++; c.push(add()); } return c.length>1?{t:'eq',c}:c[0]; };
  const add=()=>{ const c=[{op:null,n:mul()}]; while(is('+')||is('−')){ const op=tk[i++].v; c.push({op,n:mul()}); } return c.length>1?{t:'add',c}:c[0].n; };
  const mul=()=>{ const c=[{op:null,n:un()}]; while(is('×')||is('÷')){ const op=tk[i++].v; c.push({op,n:un()}); } return c.length>1?{t:'mul',c}:c[0].n; };
  const un=()=>{
    if(is('√')||is('∛')||is('∜')||is('n√')){ const v=tk[i++].v; return {t:'rt',idx:{'√':'','∛':'3','∜':'4','n√':'n'}[v],c:un()}; }
    if(is('−')||is('+')){ const v=tk[i++].v; return {t:'sg',v,c:un()}; }
    return pw();
  };
  const pw=()=>{ const b=cat(); if(is('^')){ i++; return {t:'pw',b,e:un()}; } return b; };
  const cat=()=>{ const c=[]; while(i<tk.length){ const x=tk[i]; if(x.k==='a'){ c.push({t:'a',v:x.v}); i++; } else if(x.v==='('||x.v==='['){ c.push(grp()); } else break; } return !c.length?{t:'a',v:''}:(c.length>1?{t:'cat',c}:c[0]); };
  const grp=()=>{ const o=tk[i++].v, cl=o==='('?')':']'; const c=eq(); if(is(cl)) i++; return {t:'g',o,c}; };
  const out=[];
  while(i<tk.length){ const b=i; out.push(eq()); if(i===b){ out.push({t:'a',v:tk[i].v}); i++; } }
  return out.length>1?{t:'cat',c:out}:(out[0]||{t:'a',v:''});
}
/* single-letter variables in italics, as on the slides */
const MX_VAR=/(^|[\s(\[+−×÷=,:$-])([SOCQPIBdcrfnyRK])(?=$|[\s)\]+−×÷=,;:%(₀-ₜ-])/g;
const mxIt = v => v.replace(MX_VAR,(m,a,b)=>a+'<i>'+b+'</i>').replace(MX_VAR,(m,a,b)=>a+'<i>'+b+'</i>').replace(/(^|[^A-Za-z])([SOCQ]{2})(?![A-Za-z])/g,'$1<i>$2</i>');
const mxOneDiv = n => n && n.t==='mul' && n.c.filter(x=>x.op==='÷').length===1 && n.c[n.c.length-1].op==='÷';
function mxR(n,bare){
  if(!n) return '';
  switch(n.t){
    case 'a': return mxIt(n.v);
    case 'cat': { let h=''; n.c.forEach((x,k)=>{ if(k && !(x.t==='g' && n.c[k-1].t==='g')) h+=' '; h+=mxR(x); }); return h; }
    case 'g': {
      if(bare || mxOneDiv(n.c)) return mxR(n.c);
      const inner=mxR(n.c);
      return /class="(fr|rt)/.test(inner) ? mxPa(inner,n.o) : n.o+inner+(n.o==='('?')':']');
    }
    case 'eq':  return n.c.map(x=>mxR(x)).join(' = ');
    case 'add': return n.c.map((x,k)=>(k?' '+x.op+' ':'')+mxR(x.n)).join('');
    case 'sg':  return n.v+mxR(n.c);
    case 'pw':  { const e=mxR(n.e,true), f=/class="fr"/.test(e); return '<span class="pw'+(f?' pwf':'')+'"><span class="pb">'+mxR(n.b)+'</span><span class="pe">'+(f?mxPa(e,'('):e)+'</span></span>'; }
    case 'rt':  return mxRt(mxR(n.c,true),n.idx);
    case 'mul': {
      const c=n.c;
      if(mxOneDiv(n)){                                   // a × b × c ÷ d  ->  one fraction
        const num=c.slice(0,-1).map((x,k)=>(k?' '+x.op+' ':'')+mxR(x.n,c.length===2)).join('');
        return mxFr(num,mxR(c[c.length-1].n,true));
      }
      const parts=[];                                    // I ÷ P × 365 ÷ d  ->  fraction × fraction
      c.forEach(x=>{
        if(x.op==='÷' && parts.length){ const p=parts.pop(); parts.push({op:p.op,h:mxFr(p.n?mxR(p.n,true):p.h,mxR(x.n,true)),n:null}); }
        else parts.push({op:x.op,h:mxR(x.n),n:x.n});
      });
      return parts.map((x,k)=>(k?' '+x.op+' ':'')+x.h).join('');
    }
  }
  return '';
}
const mxPrep = s => s.replace(/\b([A-Za-z])_([A-Z]{2,})\b/g,'$1<sub>$2</sub>');
function mxIsMath(seg){
  const plain=seg.replace(/<[^>]+>/g,'');
  if(/alculator|[“”]/.test(plain) || /^\s*(where|students|note)\b/i.test(plain)) return false;
  if(/[÷√∛∜^]/.test(plain) || /<sup>\(/.test(seg)) return true;
  return /=/.test(plain) && /[×−+]/.test(plain);
}
function mxSeg(seg){
  let s=seg.replace(/<sup>\(([^<]*)\)<\/sup>/g,(m,x)=>'^('+x.replace(/\//g,' ÷ ')+')');
  const prot=[];
  s=s.replace(/<(sub|sup)\b[^>]*>[\s\S]*?<\/\1>|<[^>]+>|&[a-z#0-9]+;/gi,m=>{ prot.push(m); return String.fromCharCode(0xE000+prot.length-1); });
  let h=mxR(mxParse(mxTok(s)));
  h=h.replace(/[-]/g,ch=>prot[ch.charCodeAt(0)-0xE000]);
  h=h.replace(/\s+(<sup|[²³¹⁰-⁹])/g,'$1').replace(/\s+([,.;:](?!\d))/g,'$1');
  return '<span class="mx">'+h+'</span>';
}
function mathify(line){
  line=mxPrep(String(line)).replace(/&nbsp;/g,' ');
  if(/alculator/.test(line)) return line;                 // keystroke sequences stay literal
  return line.split(/(;\s|\.\s(?=[A-Z])|<br\s*\/?>)/).map((seg,k)=> (k%2) ? seg : (mxIsMath(seg)?mxSeg(seg):seg)).join('');
}

{id:'garza', w:6, t:'Garza Electronics: level production and inventory financing cost', src:'ICQ Module 6, Problem 3',
 g:`<ul><li>Garza Electronics expects to sell 500 units in January, 250 units in February, and 1,000 units in March.</li><li>January’s beginning inventory is 700 units.</li><li>Expected sales for the whole year are 7,200 units.</li><li>Garza has decided on a level monthly production schedule of 600 units (7,200 units / 12 months = 600 units per month).</li><li>What is the expected end-of-month inventory for January, February, and March?</li></ul>` +
 wst(['In Units','Beginning Inventory','+','Production','–','Sales','=','Ending Inventory'],[
  ['January','700 units','+','600','–','500','=','{{p0f0}}'],
  ['February','____ units','+','600','–','250','=','{{p0f1}}'],
  ['March','____ units','+','600','–','1,000','=','{{p0f2}}']]),
 parts:[
  {q:'Expected ending inventory for January, February and March.', f:[{l:'January ending inventory',a:800,u:'units'},{l:'February ending inventory',a:1150,u:'units'},{l:'March ending inventory',a:750,u:'units'}],
   s:L('Formula','Ending inventory = Beginning inventory + Production \u2212 Sales')+L('January','700 + 600 \u2212 500 = 800')+L('February','800 + 600 \u2212 250 = 1,150')+L('March','1,150 + 600 \u2212 1,000 = 750')},
  {q:'Garza Electronics can borrow at 6% per year and the cost per unit of its inventory is $100 per unit. Over the January to March period, what is the total cost (in dollars) of carrying this inventory?',
   gq:calc(['Monthly financing rate = quoted Annual financing rate ÷ 12 months per year','&nbsp;&nbsp;= 6.0% per annum ÷ 12 months per year = {{f0}}']) +
      wst(['','Ending Inv. (from above)','×','Cost per Unit $100','×','Monthly financing rate','=','Monthly financing cost'],[
       ['January','____ units','×','$100','×','____ %','=','{{f1}}'],
       ['February','____ units','×','$100','×','____ %','=','{{f2}}'],
       ['March','____ units','×','$100','×','____ %','=','{{f3}}'],
       ['TOTAL FINANCING COST FOR THE PERIOD','','','','','','','{{f4}}']],[3]),
   f:[{l:'Monthly financing rate',a:0.50,u:'%',tol:.01},{l:'January financing cost',a:400,u:'$'},{l:'February financing cost',a:575,u:'$'},{l:'March financing cost',a:375,u:'$'},{l:'Total financing cost',a:1350,u:'$'}],
   s:L('Monthly rate','6.0% \u00f7 12 months = 0.50%')+L('January','800 units \u00d7 $100 \u00d7 0.50% = $400')+L('February','1,150 \u00d7 $100 \u00d7 0.50% = $575')+L('March','750 \u00d7 $100 \u00d7 0.50% = $375')+L('Total','400 + 575 + 375 = $1,350')+'<p class="note">Type 0.50% as 0.005 in your calculator, or type 0.5 then the % key.</p>'}
 ]},
{id:'gabriel', w:6, t:'Gabriel Health Services: short-term versus long-term financing cost', src:'ICQ Module 6, Problem 11',
 g:`<ul><li>Gabriel Health Services Ltd. requires $1.5 million in financing over the next two years.</li><li>The firm can borrow at 5 percent per year over the two years.</li><li>However, with some economic forecasting, it has been suggested that financing in the first year will be 3.5 percent and 6.25 percent in the second year.</li></ul>`,
 parts:[
  {q:'a. Determine the total interest charges under both possibilities. (Enter answers in whole dollar, not in millions.) b. Which action is less costly?',
   gq:wst(['Plan type','Amount In $','×','Applicable Rate','×','Number of years','=','Total financing cost'],[
    ['Long-term rate','$________','×','____ %','×','2 years','=','$________'],
    ['TOTAL','','','','','','','{{f0}}'],
    ['Short-term rate','$________','×','____ %','×','1 year','=','$________'],
    ['','$________','×','____ %','×','1 year','=','$________'],
    ['TOTAL','','','','','','','{{f1}}']],[1,4]),
   f:[{l:'Long-term plan total',a:150000,u:'$'},{l:'Short-term plan total',a:146250,u:'$'},{l:'Less costly plan',a:'Short-term',choice:['Long-term','Short-term']}],
   s:L('Long-term','$1,500,000 \u00d7 5.00% \u00d7 2 years = $150,000')+L('Short-term, year 1','$1,500,000 \u00d7 3.50% \u00d7 1 year = $52,500')+L('Short-term, year 2','$1,500,000 \u00d7 6.25% \u00d7 1 year = $93,750')+L('Short-term total','52,500 + 93,750 = $146,250')+L('Conclusion','Short-term is less costly by $3,750, but its year 2 rate is a forecast, not a guarantee')},
  {q:'What if Year 2 rates will be 7.25% (remember, the future is un-certain)?',
   gq:wst(['Plan type','Amount In $','×','Applicable Rate','×','Number of years','=','Total financing cost'],[
    ['Long-term rate','$1,500,000','×','5.00 %','×','2 years','=','$150,000'],
    ['TOTAL','','','','','','','$150,000'],
    ['Short-term rate','$1,500,000','×','3.50 %','×','1 year','=','$52,500'],
    ['','$1,500,000','×','7.25 %','×','1 year','=','{{f0}}'],
    ['TOTAL','','','','','','','{{f1}}']],[1,4]),
   f:[{l:'Year 2 cost at 7.25%',a:108750,u:'$'},{l:'New short-term total',a:161250,u:'$'},{l:'Still less costly?',a:'No',choice:['Yes','No']}],
   s:L('Year 2','$1,500,000 \u00d7 7.25% \u00d7 1 year = $108,750')+L('New total','52,500 + 108,750 = $161,250')+L('Compare','$161,250 > $150,000 long-term, so short-term is now more expensive')+'<p class="note">This is the risk of short-term financing: the rate in a later year is not locked in, so the cost can swing above the long-term alternative.</p>'}
 ]},
{id:'termstructure', w:6, t:'Expectations hypothesis: multi-year expected returns', src:'ICQ Module 6, Problem 25',
 g:`<p>Using the expectations hypothesis theory for the term structure of interest rates, determine the expected return* for securities with maturities of two, three, and four years based on the following data.</p><p class="note">* Professor clarification: expected returns should be quoted annually, and therefore, this question is asking what is the annual expected return for each situation. (Input your answers as a percent rounded to 2 decimal places. Do not round intermediate calculations.)</p>` +
 tb(['Security duration (i.e. time period) and start date','YIELD: The observed rate for the time period'],[['1-year T-bill at beginning of year 1','5 %'],['1-year T-bill at beginning of year 2','8 %'],['1-year T-bill at beginning of year 3','7 %'],['1-year T-bill at beginning of year 4','10 %']]),
 parts:[
  {q:'[a] Close estimate', gq:calc([
    '2 year security: ( __ % + __ % ) / 2 = {{f0}}',
    '3 year security: ( __ % + __ % + __ % ) / 3 = {{f1}}',
    '4 year security: ( __ % + __ % + __ % + __ % ) / 4 = {{f2}}']),
   f:[{l:'2-year security',a:6.50,u:'%',tol:.02},{l:'3-year security',a:6.67,u:'%',tol:.02},{l:'4-year security',a:7.50,u:'%',tol:.02}],
   s:L('2-year','( 5% + 8% ) / 2 = 6.50%')+L('3-year','( 5% + 8% + 7% ) / 3 = 6.67%')+L('4-year','( 5% + 8% + 7% + 10% ) / 4 = 7.50%')+'<p class="note">Calculator trap: typing 5% + 8% \u00f7 2 without brackets divides only the 8% first. Use brackets around the whole sum.</p>'},
  {q:'[b] Exact calculation, using “roots” (square root, cube root, fourth root)', gq:calc([
    '2 year security = √[ (1 + 0.__) (1 + 0.__) ] − 1 = 0.______ = {{f0}}',
    '3 year security = ∛[ (1 + 0.__) (1 + 0.__) (1 + 0.__) ] − 1 = 0.______ = {{f1}}',
    '4 year security = ∜[ (1 + 0.__) (1 + 0.__) (1 + 0.__) (1 + 0.__) ] − 1 = 0.______ = {{f2}}']),
   f:[{l:'2-year security',a:6.49,u:'%',tol:.02},{l:'3-year security',a:6.66,u:'%',tol:.02},{l:'4-year security',a:7.48,u:'%',tol:.02}],
   s:L('Formula','Exact rate = ⁿ√[ (1 + r₁) (1 + r₂) ⋯ (1 + rₙ) ] − 1')+L('2-year','√[ (1.05) (1.08) ] − 1 = 0.0649 = 6.49%')+L('3-year','∛[ (1.05) (1.08) (1.07) ] − 1 = 0.0666 = 6.66%')+L('4-year','∜[ (1.05) (1.08) (1.07) (1.10) ] − 1 = 0.0748 = 7.48%')+'<p class="note">Calculator trap: multiply every bracket together first, THEN apply the root, THEN subtract 1. Doing the root on only the last number before multiplying gives a wrong, much larger answer.</p>'}
 ]},
{id:'hip-plans', w:6, t:'HIP Corporation: financing plans for current (and total) assets', src:'ICQ Module 6, Financing Plans for Current (and Total) Assets',
 g:`<p>The Hudovernik Interesting Products Corporation (“HIP” Corporation) produces goods for sale in the Toronto region. Assume we are comparing alternative financing plans for HIP’s Assets, which we know are comprised of current assets (otherwise known as “working capital”) and capital assets.</p><p>As seen below, a total of $1,000,000 worth of financing is required: $400,000 of working capital (i.e. the company’s “current assets”) and $600,000 of capital assets must be financed. To accomplish the financing of the $1,000,000 of assets, we will analyze the financing cost of 3 plans. Assume: short-term interest rates are 6% and long-term interest rates are 10%.</p>` +
 tb(['HIP Corporation: Balance Sheet Assets',''],[['Temporary Current Assets','$300,000'],['Permanent Current Assets','$100,000'],['Capital Assets (i.e. Property, Plant &amp; Equipment)','$600,000'],['TOTAL ASSETS','$1,000,000']],[3]) +
 `<ul><li><b>Plan A:</b> finance all current assets (both temporary and permanent) with short-term funds; the remaining financing is long-term (for the capital assets). Short term = ($300,000 + $100,000) ÷ $1,000,000 = 40%; long term = 60%.</li><li><b>Plan B:</b> finance only $200,000 of working capital with short-term money; the rest is long-term. Short term = $200,000 ÷ $1,000,000 = 20%; long term = 80%.</li><li><b>Plan C (perfectly hedged):</b> finance temporary current assets with short-term funds; permanent current assets and capital assets with long-term funds. Percentages: see Step 1 below.</li></ul>`,
 parts:[
  {q:'Plan A: 40% short-term and 60% long-term.', gq:wst(['Assets to be financed','% Short term or Long term','=','Amount to be financed','×','Applicable Rate','=','Total financing cost'],[

    ['','× 60% long-term','=','{{f1}}','×','10 %','=','{{f3}}'],
    ['TOTAL','','','','','','','{{f4}}']],[2]),
   f:[{l:'Short-term amount',a:400000,u:'$'},{l:'Long-term amount',a:600000,u:'$'},{l:'Short-term cost',a:24000,u:'$'},{l:'Long-term cost',a:60000,u:'$'},{l:'Total financing cost',a:84000,u:'$'}],
   s:L('Short-term','40% × $1,000,000 = $400,000 × 6% = $24,000')+L('Long-term','60% × $1,000,000 = $600,000 × 10% = $60,000')+L('Total','$24,000 + $60,000 = $84,000')},
  {q:'Plan B: 20% short-term and 80% long-term.', gq:wst(['Assets to be financed','% Short term or Long term','=','Amount to be financed','×','Applicable Rate','=','Total financing cost'],[
    ['$________','× 20% short-term','=','{{f0}}','×','6 %','=','{{f2}}'],
    ['','× 80% long-term','=','{{f1}}','×','10 %','=','{{f3}}'],
    ['TOTAL','','','','','','','{{f4}}']],[2]),
   f:[{l:'Short-term amount',a:200000,u:'$'},{l:'Long-term amount',a:800000,u:'$'},{l:'Short-term cost',a:12000,u:'$'},{l:'Long-term cost',a:80000,u:'$'},{l:'Total financing cost',a:92000,u:'$'}],
   s:L('Short-term','20% × $1,000,000 = $200,000 × 6% = $12,000')+L('Long-term','80% × $1,000,000 = $800,000 × 10% = $80,000')+L('Total','$12,000 + $80,000 = $92,000')},
  {q:'Plan C, Step 1: calculate the relative percentage of total assets to be financed on a short-term and long-term basis.', gq:wst(['Type of Asset','Short-term','Long-term','TOTAL'],[
    ['Temporary Current Assets','$________','$________','$________'],
    ['Permanent Current Assets','$________','$________','$________'],
    ['Capital Assets','$________','$________','$________'],
    ['TOTAL by Basis','{{f0}}','{{f1}}','$________'],
    ['% of TOTAL ASSETS','{{f2}}','{{f3}}','100%']],[3,4]) +
   `<p class="note">Basis of financing: enter only ONE amount per asset type.</p>`,
   f:[{l:'Short-term total',a:300000,u:'$'},{l:'Long-term total',a:700000,u:'$'},{l:'Short-term % of total assets',a:30,u:'%'},{l:'Long-term % of total assets',a:70,u:'%'}],
   s:L('Short-term basis','Temporary current assets only: $300,000')+L('Long-term basis','Permanent current assets $100,000 + capital assets $600,000 = $700,000')+L('Percentages','$300,000 ÷ $1,000,000 = 30% short-term; $700,000 ÷ $1,000,000 = 70% long-term')},
  {q:'Plan C, Step 2: use the Step 1 percentages in the template.', gq:wst(['Assets to be financed','% Short term or Long term','=','Amount to be financed','×','Applicable Rate','=','Total financing cost'],[
    ['$________','× ____ % short-term','=','{{f0}}','×','6 %','=','{{f2}}'],
    ['','× ____ % long-term','=','{{f1}}','×','10 %','=','{{f3}}'],
    ['TOTAL','','','','','','','{{f4}}']],[2]),
   f:[{l:'Short-term amount',a:300000,u:'$'},{l:'Long-term amount',a:700000,u:'$'},{l:'Short-term cost',a:18000,u:'$'},{l:'Long-term cost',a:70000,u:'$'},{l:'Total financing cost',a:88000,u:'$'}],

{id:'lear', w:6, t:'Lear Inc.: cost of two financing plans', src:'Connect quiz, Module 6 Q1',

{id:'gocbonds', w:6, t:'Government of Canada bonds: anticipated one-year forward rates', src:'Connect quiz, Module 6 Q2',
 g:tb(['Coupon','Maturity','Price','Yield'],[['8.25%','Mar. 1, 20YY + 1','$102.75','5.78%'],['3.75%','Mar. 1, 20YY + 2','$95.70','5.85%'],['5.75%','Mar. 1, 20YY + 3','$98.65','6.22%']]) +
 `<p>As of the close of business March 1, 20YY. Round final answers to 2 decimal places; do not round intermediate calculations.</p>`,
 parts:[
  {q:'Calculate the anticipated one-year interest rate for the 2nd year and the 3rd year, using the expectations hypothesis.', gq:calc([
    'Expectations hypothesis: a long rate is the average of the expected one-year rates it spans, so:', '( 1 + y<sub>n</sub> )<sup>n</sup> = ( 1 + y<sub>n−1</sub> )<sup>n−1</sup> × ( 1 + f<sub>n</sub> )',
    '2nd year: f<sub>2</sub> = ( 1 + 0.____ )<sup>2</sup> ÷ ( 1 + 0.____ ) − 1 = 0.____ = {{f0}}',
    '3rd year: f<sub>3</sub> = ( 1 + 0.____ )<sup>3</sup> ÷ ( 1 + 0.____ )<sup>2</sup> − 1 = 0.____ = {{f1}}']), f:[{l:'2nd year rate',a:5.92,u:'%',tol:.04},{l:'3rd year rate',a:6.96,u:'%',tol:.04}],
   s:L('Idea','A multi-year yield is the geometric average of the one-year rates expected over its life, so each forward rate can be backed out from two adjacent yields')+L('2nd year formula','(1 + y\u2082)\u00b2 \u00f7 (1 + y\u2081) \u2212 1')+L('2nd year','(1.0585)\u00b2 \u00f7 1.0578 \u2212 1 = 1.12042225 \u00f7 1.0578 \u2212 1 = 0.0592 = 5.92%')+L('3rd year formula','(1 + y\u2083)\u00b3 \u00f7 (1 + y\u2082)\u00b2 \u2212 1')+L('3rd year','(1.0622)\u00b3 \u00f7 (1.0585)\u00b2 \u2212 1 = 1.19844716 \u00f7 1.12042225 \u2212 1 = 0.0696 = 6.96%')}
 ]},
{id:'vincent', w:6, t:'Vincent Black Lightning: fixed vs. variable short-term financing cost', src:'Connect quiz, Module 6 Q3',

{id:'concbank', w:7, t:'Concentration banking: is the cash management package worth it?', src:'ICQ Module 7, Problem 7',
 g:`<ul><li>Your banker has analyzed your company account and has suggested that her bank has a cash management package for you.</li><li>She suggests that with a concentration banking system, {the time needed to make funds from deposited customer cheques available to you} can be reduced by three days on average.</li><li>You, of course, are delighted (you’re not sure why), but you do know your average daily collections amount to $305,000.</li><li>Your opportunity cost of funds is 9 percent.</li><li>The bank provides this service for $52,500 plus a compensating balance in your current account of $75,000.</li><li>(A compensating balance is the amount you are required to maintain interest free at that bank; a “&gt;$0 minimum” amount required in your bank account.)</li><li>Is this package worth it? If so, by how much?</li></ul>` +
 wst(null,[
  ['$305,000 daily receipts × 3 days speed up =','{{p0f0}}'],
  ['subtract: compensating balance requirement','$________'],
  ['Net funds freed up','{{p0f1}}'],
  ['Opportunity benefit (cost) of funds at:','9%'],
  ['Annual benefit: = Net funds freed up × 9%','{{p0f2}}'],
  ['subtract: Annual new bank fee','$________'],
  ['Annual savings from concentration banking system','{{p0f3}}']],[2,6]) +
 `<p class="note">Conclusion: {{p0f4}} the package, there are ____ incremental benefits compared to incremental fees.</p>`,
 parts:[
  {q:'Is the package worth it? If so, by how much?', f:[{l:'Funds freed up by the speedup',a:915000,u:'$'},{l:'Net funds freed up',a:840000,u:'$'},{l:'Annual benefit at 9%',a:75600,u:'$'},{l:'Annual savings from the package',a:23100,u:'$'},{l:'Accept the package?',a:'Accept',choice:['Accept','Reject']}],
   s:L('Funds freed up','$305,000 \u00d7 3 days = $915,000')+L('Net funds freed up','915,000 \u2212 compensating balance 75,000 = 840,000')+L('Annual benefit','840,000 \u00d7 9% = 75,600')+L('Annual savings','75,600 \u2212 annual fee 52,500 = 23,100')+L('Conclusion','Accept the package: the incremental benefits ($75,600) exceed the incremental fees ($52,500) by $23,100 a year')}
 ]},
{id:'comiskey', w:7, t:'Comiskey Fence Co.: should credit be extended to new customers?', src:'ICQ Module 7, Problems 23 and 24',
 g:`<ul><li>Comiskey Fence Co. is evaluating extending credit to a new group of customers.</li><li>Although these customers will provide $180,000 in additional credit sales, 12 percent are likely to be uncollectible.</li><li>The company will incur $15,700 in additional collection expenses.</li><li>Production and marketing expenses represent 70 percent of sales.</li><li>The company has a receivables turnover of five times.</li><li>No other asset buildup will be required to service the new customers.</li><li>The firm has a 15 percent desired return on investment.</li></ul>`,
 parts:[
  {q:'a. If 12% of the new sales prove uncollectible, should Comiskey extend credit?', gq:wst(null,[
    ['Added sales','$________'],
    ['subtract: Accounts uncollectible (12% of new sales)','{{f0}}'],
    ['Annual incremental revenue','{{f1}}'],
    ['subtract: Collection costs','$________'],
    ['subtract: Production and selling costs (70% of new sales)','{{f2}}'],
    ['Annual income before taxes','{{f3}}']],[2,5]) +
   calc(['Investment in accounts receivable = Sales ÷ Turnover = $________ ÷ 5 = {{f4}}',
         'Return on incremental investment = $________ ÷ $________ = 0.____ = {{f5}}']) +
   `<p class="note">Conclusion: extend credit to these customers? {{f6}} — because ____% incremental return is ______ than 15%.</p>`, f:[{l:'Accounts uncollectible',a:21600,u:'$'},{l:'Annual incremental revenue',a:158400,u:'$'},{l:'Production and selling costs',a:126000,u:'$'},{l:'Annual income before taxes',a:16700,u:'$'},{l:'Investment in accounts receivable',a:36000,u:'$'},{l:'Return on incremental investment',a:46.4,u:'%'},{l:'Extend credit?',a:'Yes',choice:['Yes','No']}],
   s:L('Uncollectible','12% \u00d7 180,000 = 21,600')+L('Incremental revenue','180,000 \u2212 21,600 = 158,400')+L('Production and selling','70% \u00d7 180,000 = 126,000')+L('Income before taxes','158,400 \u2212 15,700 \u2212 126,000 = 16,700')+L('Investment in AR','Sales 180,000 \u00f7 turnover 5 = 36,000')+L('Return','16,700 \u00f7 36,000 = 46.4%')+L('Conclusion','Yes, extend credit: 46.4% is well above the 15% desired return')},
  {q:'b. What if 15% of the new sales prove uncollectible instead?', gq:wst(null,[
    ['Added sales','$________'],
    ['subtract: Accounts uncollectible (15% of new sales)','{{f0}}'],
    ['Annual incremental revenue','$________'],
    ['subtract: Collection costs','$________'],
    ['subtract: Production and selling costs (70% of new sales)','$________'],
    ['Annual income before taxes','{{f1}}']],[2,5]) +
   calc(['Return on incremental investment = $________ ÷ $________ = 0.____ = {{f2}}']) +
   `<p class="note">Conclusion: extend credit? {{f3}} — because ____% is ______ than 15%.</p>`, f:[{l:'Accounts uncollectible',a:27000,u:'$'},{l:'Annual income before taxes',a:11300,u:'$'},{l:'Return on incremental investment',a:31.4,u:'%'},{l:'Extend credit?',a:'Yes',choice:['Yes','No']}],
   s:L('Uncollectible','15% \u00d7 180,000 = 27,000 (5,400 more than part a)')+L('Income before taxes','180,000 \u2212 27,000 \u2212 15,700 \u2212 126,000 = 11,300')+L('Return','11,300 \u00f7 36,000 (from part a) = 31.4%')+L('Conclusion','Yes, extend credit: 31.4% is still greater than 15%')},
  {q:'c. What if receivables turnover drops to 1.5\u00d7, with 12% of accounts uncollectible as in part a?', gq:calc([
    'If receivable turnover drops to 1.5x (“One point five times”), the investment in accounts receivable would be:',
    'Accounts Receivable = $________ divided by 1.5 times = {{f0}}',
    'Return on incremental investment = $________ ÷ $________ = 0.____ = {{f1}}']) +
   `<p class="note">Conclusion: should the credit be extended? {{f2}} — because ____% is ______ than the desired 15%.</p>`, f:[{l:'New investment in accounts receivable',a:120000,u:'$'},{l:'Return on incremental investment',a:13.92,u:'%',tol:.05},{l:'Extend credit?',a:'No',choice:['Yes','No']}],
   s:L('New investment in AR','180,000 \u00f7 1.5 = 120,000')+L('Return','16,700 (from part a) \u00f7 120,000 = 13.92%')+L('Conclusion','No: 13.92% is less than the desired 15%, so credit should not be extended on this basis')},
  {q:'d. (Problem 24) What if the average collection period is 120 days instead, with 12% uncollectible as in part a?', gq:calc([
    'First compute the new accounts receivable balance.',
    'Accounts receivable = Average collection period × average daily sales = 120 days × ( $________ ÷ 365 ) = 120 days × $______ = $________',
    'OR:',
    'Accounts receivable turnover = 365 ÷ Average collection period = 365 days ÷ 120 days = {{f0}}',
    'Accounts receivable = Sales ÷ accounts receivable turnover = $________ ÷ ____ times = {{f1}}',
    'Return on incremental investment = $________ ÷ $________ = 0.____ = {{f2}}']) +
   `<p class="note">Conclusion: extend credit? {{f3}} — ____% is ______ than 15%.</p>`, f:[{l:'Accounts receivable turnover',a:3.04,u:'x',tol:.02},{l:'New investment in accounts receivable',a:59178,u:'$',tol:40},{l:'Return on incremental investment',a:28.22,u:'%',tol:.05},{l:'Extend credit?',a:'Yes',choice:['Yes','No']}],
   s:L('AR turnover','365 \u00f7 120 days = 3.0417 times')+L('New investment in AR','180,000 \u00f7 3.0417 = 59,178')+L('Return','16,700 (from part a) \u00f7 59,178 = 28.22%')+L('Conclusion','Yes, extend credit: 28.22% is greater than 15%')}
 ]},
{id:'gic', w:7, t:'Annual return on an interest-paying security (GIC)', src:'ICQ Module 7, Annual Return example',
 g:`<ul><li>For the next 90 days, you lend $100,000 evidenced by a GIC (Guaranteed Investment Certificate).</li><li>The borrower has negotiated this 90 day loan with $4,000 in interest payment.</li><li>What is your return?</li></ul>` +
 calc(['R<sub>ANNUAL</sub> = ( Interest payment ÷ Principal amount ) × ( 365 ÷ days )',
       'R<sub>ANNUAL</sub> = ( I ÷ P ) × ( 365 ÷ d ) = ( $______ ÷ $________ ) × ( 365 ÷ __ ) = {{p0f0}}']),
 parts:[
  {q:'What is your annualized return?', f:[{l:'Annual return',a:16.22,u:'%',tol:.05}],
   s:L('Formula','R_ANNUAL = (Interest \u00f7 Principal) \u00d7 (365 \u00f7 days)')+L('Calculation','(4,000 \u00f7 100,000) \u00d7 (365 \u00f7 90) = 0.04 \u00d7 4.0556 = 0.1622 = 16.22%')}
 ]},
{id:'discyield', w:7, t:'Discount security: annualized yield vs. annualized effective yield', src:'ICQ Module 7, Rates of Return (Yield Calculations)',
 g:`<p>Annualized Yield: As an example, suppose a financial security sells at 99.531 % of its maturity value, with maturity occurring in 90 days. (Discount traded security)</p><p>The annualized yield that would be quoted in the marketplace is given by the formula:</p>` +
 calc(['Annualized Yield&nbsp; r = ( $100 − P ) ÷ P × ( 365 ÷ d )',
       'where&nbsp; P = Discounted price as percentage of maturity value',
       '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; d = Number of days to maturity',
       '&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; r = Annualized yield',
       'r = ( $100 − $99.531 ) ÷ $99.531 × ( 365 ÷ 90 ) = {{p0f0}}',
       'Annualized Effective Yield&nbsp; r<sub>EFF</sub> = [ 1 + ( $100 − P ) ÷ P ]<sup>(365/d)</sup> − 1 = {{p0f1}}']) +
 `<p class="note">Calculator reminder, order of operations — annualized yield: 100 − 99.531 = &nbsp;÷ 99.531 = &nbsp;× 365 = &nbsp;÷ 90 =. Annualized effective yield: 100 − 99.531 = &nbsp;÷ 99.531 = &nbsp;+ 1 = &nbsp;y<sup>x</sup> ( 365 ÷ 90 ) = &nbsp;− 1 =.</p>`,
 parts:[
  {q:'Find the annualized yield, and the annualized effective yield that accounts for compounding.', f:[{l:'Annualized yield',a:1.91,u:'%',tol:.03},{l:'Annualized effective yield',a:1.92,u:'%',tol:.03}],
   s:L('Annualized yield formula','r = [(100 \u2212 P) \u00f7 P] \u00d7 (365 \u00f7 d)')+L('Annualized yield','[(100 \u2212 99.531) \u00f7 99.531] \u00d7 (365 \u00f7 90) = 0.019110 = 1.91%')+L('Effective yield formula','(1 + (100 \u2212 P) \u00f7 P)^(365 \u00f7 d) \u2212 1')+L('Effective yield','(1 + 0.004712)^(365\u00f790) \u2212 1 = 0.019248 = 1.92%')+L('Why they differ','The effective yield compounds the 90-day return over the periods in a year; the simple annualized yield does not')}
 ]},
{id:'eoq-centennial', w:7, t:'Centennial Company: economic ordering quantity, total cost and safety stock', src:'ICQ Module 7, EOQ in-class example',
 g:`<ul><li>Assume the Centennial Company sells 2,000 units each year.</li><li>Every time the Centennial Company makes an order from its supplier, the cost is $8 per order.</li><li>When the Centennial Company stores the inventory in its warehouse, the annual cost of holding that inventory, or the “Carrying Cost of Inventory”, is $0.20 per unit per year.</li></ul>` +
 calc(['EOQ = √( 2 × S × O ÷ C )', 'where S = Total sales in units, O = Ordering cost for each order, C = Carrying cost per unit in dollars']),
 parts:[
  {q:'Economic Ordering Quantity: how many units should Centennial order each time?', gq:calc([
    'EOQ = √( 2 × ______ units × $____ per order ÷ $____ per unit ) = √( $________ units per order ÷ $____ per unit ) = √ ________ units² per order = {{f0}}']),
   f:[{l:'EOQ',a:400,u:'units'}],
   s:L('Inside the root first','2 × 2,000 × $8 = $32,000; $32,000 ÷ $0.20 = 160,000')+L('Then the root','√160,000 = 400 units per order')},
  {q:'Total cost of inventory: TC = Order Costs + Carrying Costs.', gq:calc([
    'TC = ( S × O ) ÷ Q + ( C × Q ) ÷ 2 = ( ______ units × $____ ) ÷ ____ units per order + ( $____ per unit × ____ units per order ) ÷ 2',
    'TC = ( ____ orders × $____ ) + ( $____ × ____ units ) = {{f0}} + {{f1}} = {{f2}}']),
   f:[{l:'Order cost',a:40,u:'$'},{l:'Carrying cost',a:40,u:'$'},{l:'Total cost',a:80,u:'$'}],
   s:L('Number of orders','2,000 ÷ 400 = 5 orders × $8 = $40.00')+L('Carrying cost','$0.20 × average inventory of 200 units (400 ÷ 2) = $40.00')+L('TC','$40 + $40 = $80.00')+'<p class="note">At the EOQ, total ordering cost equals total carrying cost.</p>'},
  {q:'Safety stock: Centennial wants 50 units of safety stock. What are the new average inventory and the new carrying cost?', gq:calc([
    'Average inventory = EOQ ÷ 2 + Safety stock = ____ units ÷ 2 + 50 units = {{f0}}',
    'New Carrying Cost = Average inventory in units × Carrying cost per unit = ____ units × $____ per unit = {{f1}}']),
   f:[{l:'New average inventory',a:250,u:'units'},{l:'New carrying cost',a:50,u:'$'}],
   s:L('Average inventory','400 ÷ 2 + 50 = 250 units')+L('Carrying cost','250 × $0.20 = $50 (up $10 from $40), so total cost rises to $90')}
 ]}
,
{id:'higgins', w:7, t:'Higgins Athletic Wear: EOQ, average inventory and total inventory cost', src:'ICQ Module 7, Problem 41',
 g:`<p>Higgins Athletic Wear has expected sales of 22,500 units a year, carrying costs of $1.50 per unit, and an ordering cost of $3.00 per order.</p><p class="note">Calculator reminder: do the math inside each “root” first, then take the root of the result. For total cost, do the division in each fraction first, then add the results together.</p>`,
 parts:[
  {q:'a. What is the economic order quantity?', gq:calc(['EOQ = √( 2SO ÷ C ) = √( 2 × ______ × $____ ÷ $____ ) = √ ________ = {{f0}}']), f:[{l:'EOQ',a:300,u:'units'}],
   s:L('Formula','EOQ = \u221a(2 \u00d7 S \u00d7 O \u00f7 C)')+L('Calculation','\u221a(2 \u00d7 22,500 \u00d7 3 \u00f7 1.50) = \u221a90,000 = 300 units')},
  {q:'b. What is average inventory, and the total carrying cost?', gq:calc(['EOQ ÷ 2 = ____ units ÷ 2 = {{f0}} (average inventory)',
         '____ units × $____ carrying cost per unit = {{f1}} total carrying cost']), f:[{l:'Average inventory',a:150,u:'units'},{l:'Total carrying cost',a:225,u:'$'}],
   s:L('Average inventory','EOQ \u00f7 2 = 300 \u00f7 2 = 150 units')+L('Total carrying cost','150 \u00d7 $1.50 = $225')},
  {q:'c. What is the total inventory cost?', gq:calc(['TC = SO ÷ Q + CQ ÷ 2 = ( ______ × $____ ) ÷ ____ + ( $____ × ____ ) ÷ 2',
         '&nbsp;&nbsp;&nbsp;= {{f0}} × $____ + $____ × ____ units = {{f1}} + {{f2}} = {{f3}}']), f:[{l:'Number of orders',a:75,u:'orders'},{l:'Order cost',a:225,u:'$'},{l:'Carrying cost',a:225,u:'$'},{l:'Total inventory cost',a:450,u:'$'}],
   s:L('Number of orders','22,500 \u00f7 300 = 75 orders')+L('Order cost','75 \u00d7 $3 = $225')+L('Carrying cost','$1.50 \u00d7 150 = $225')+L('TC','225 + 225 = $450')},
  {q:'d. If an additional 30 units are required as safety stock, what are the new average inventory and new total carrying cost?', gq:calc(['Average inventory = EOQ ÷ 2 + Safety stock = ____ ÷ 2 + ____ = {{f0}}',
         '____ units × $____ carrying cost per unit = {{f1}} total carrying cost']), f:[{l:'New average inventory',a:180,u:'units'},{l:'New total carrying cost',a:270,u:'$'}],
   s:L('Average inventory with safety stock','300 \u00f7 2 + 30 = 180 units')+L('New carrying cost','180 \u00d7 $1.50 = $270')}
 ]}
,
{id:'fisk', w:7, t:'Fisk Corporation: EOQ after a drop in ordering cost', src:'Connect quiz, Module 7 Q1',
 g:`<p>Fisk Corporation anticipates sales of 56,000 units a year, an ordering cost of $8 per order, and carrying costs of $1.40 per unit. In the second year, Fisk finds it can reduce ordering costs to $2 per order; carrying costs stay at $1.40 per unit.</p>`,
 parts:[
  {q:'a-1. What is the EOQ for the second year?', gq:calc(['EOQ = √( 2SO ÷ C ) = √( 2 × ______ × $____ ÷ $____ ) = √ ________ = {{f0}}']), f:[{l:'Economic ordering quantity (EOQ)',a:400,u:'units'}],
   s:L('Formula','EOQ = \u221a(2 \u00d7 S \u00d7 O \u00f7 C)')+L('Calculation','\u221a(2 \u00d7 56,000 \u00d7 2 \u00f7 1.40) = \u221a160,000 = 400 units')},
  {q:'a-2. How many orders will be placed during the second year?', gq:calc(['Number of orders = S ÷ EOQ = ______ ÷ ____ = {{f0}}']), f:[{l:'Number of orders',a:140,u:'orders'}],
   s:L('Formula','Number of orders = Annual sales in units \u00f7 EOQ')+L('Calculation','56,000 \u00f7 400 = 140 orders')},
  {q:'a-3. What will average inventory be for the second year?', gq:calc(['Average inventory = EOQ ÷ 2 = ____ ÷ 2 = {{f0}}']), f:[{l:'Average inventory',a:200,u:'units'}],
   s:L('Formula','Average inventory = EOQ \u00f7 2')+L('Calculation','400 \u00f7 2 = 200 units')},
  {q:'a-4. What is the total cost of ordering and carrying inventory for the second year?', gq:calc(['TC = SO ÷ Q + CQ ÷ 2 = ____ orders × $____ + $____ × ____ units = $____ + $____ = {{f0}}']), f:[{l:'Total costs',a:560,u:'$'}],
   s:L('Formula','TC = (Number of orders \u00d7 Order cost) + (Carrying cost per unit \u00d7 Average inventory)')+L('Calculation','(140 \u00d7 $2) + ($1.40 \u00d7 200) = $280 + $280 = $560')}
 ]},
{id:'henderson', w:7, t:'Henderson Office Supplies: liberalizing credit, with and without an inventory buildup', src:'Connect quiz, Module 7 Q2',
 g:`<p>Henderson Office Supplies is considering a more liberal credit policy to increase sales by $71,000. It expects 9% of the new accounts to be uncollectible, collection costs of 2% of new sales, production costs of 80% of sales, and accounts receivable turnover of 2 times. No other asset buildup is assumed at first.</p>`,
 parts:[
  {q:'a. What is the level of investment in accounts receivable to support this sales expansion?', gq:calc(['Investment in accounts receivable = Sales ÷ Turnover = $________ ÷ ____ = {{f0}}']), f:[{l:'Investment in accounts receivable',a:35500,u:'$'}],
   s:L('Formula','Investment in AR = New sales \u00f7 Receivables turnover')+L('Calculation','71,000 \u00f7 2 = $35,500')},
  {q:'b. What would be Henderson\u2019s incremental before-tax return on investment?', gq:wst(null,[
    ['Added sales','$________'],
    ['subtract: Accounts uncollectible (9% of new sales)','$________'],
    ['Annual incremental revenue','$________'],
    ['subtract: Collection costs (2% of new sales)','$________'],
    ['subtract: Production costs (80% of new sales)','$________'],
    ['Annual income before taxes','{{f0}}']],[2,5]) +
   calc(['Return on incremental investment = $________ ÷ $________ = 0.____ = {{f1}}']), f:[{l:'Incremental income before tax',a:6390,u:'$'},{l:'Return on incremental investment',a:18,u:'%'}],
   s:L('Uncollectible','9% \u00d7 71,000 = 6,390')+L('Collection costs','2% \u00d7 71,000 = 1,420')+L('Production costs','80% \u00d7 71,000 = 56,800')+L('Income before tax','71,000 \u2212 6,390 \u2212 1,420 \u2212 56,800 = 6,390')+L('Return','6,390 \u00f7 35,500 (from part a) = 18%')},
  {q:'c. Should Henderson liberalize credit if a 15% before-tax return is required?', gq:`<p class="note">Conclusion: liberalize credit? {{f0}} — because ____% is ______ than the required 15%.</p>`, f:[{l:'Liberalize credit?',a:'Yes',choice:['Yes','No']}],
   s:L('Compare','18% (from part b) is greater than the required 15%, so yes, liberalize credit')},
  {q:'d. Now assume Henderson also needs to increase inventory to support the new sales, with inventory turnover of 5\u00d7 on cost of goods sold. What is the total incremental investment in accounts receivable and inventory?', gq:calc(['Investment in inventory = Sales ÷ Inventory turnover = $________ ÷ ____ = {{f0}}',
         'Total incremental investment = Accounts receivable + Inventory = $________ + $________ = {{f1}}']), f:[{l:'Investment in inventory',a:11360,u:'$'},{l:'Total incremental investment',a:46860,u:'$'}],
   s:L('COGS of the new sales','Production costs from part b = 80% \u00d7 71,000 = 56,800')+L('Investment in inventory','56,800 \u00f7 inventory turnover 5 = 11,360')+L('Total investment','AR 35,500 (part a) + inventory 11,360 = 46,860')},
  {q:'e. Given the income from part b and the investment from part d, should Henderson extend more liberal credit terms?', gq:calc(['Return on total investment = $________ ÷ $________ = 0.____ = {{f0}}']) +
   `<p class="note">Conclusion: extend credit? {{f1}} — because ____% is ______ than 15%.</p>`, f:[{l:'Return on total investment',a:13.64,u:'%',tol:.05},{l:'Extend credit?',a:'No',choice:['Yes','No']}],
   s:L('Return','6,390 (part b) \u00f7 46,860 (part d) = 13.64%')+L('Compare','13.64% is less than the required 15%, so no, once the inventory buildup is included the expansion no longer clears the hurdle')}
 ]},
{id:'lett', w:7, t:'Lett\u2019s commercial paper: yield and effective annual yield', src:'Connect quiz, Module 7 Q3',
 g:`<p>Lett\u2019s commercial paper is selling at a discount. It sells for 98.32% of par and matures in 100 days. Use 365 days a year; do not round intermediate calculations.</p>`,
 parts:[
  {q:'a. Calculate its yield as quoted in the market.', gq:calc(['r = ( 100 − P ) ÷ P × 365 ÷ d = ( 100 − ______ ) ÷ ______ × 365 ÷ ____ = 0.____ = {{f0}}']), f:[{l:'Yield',a:6.24,u:'%',tol:.04}],
   s:L('Formula','r = [(100 \u2212 P) \u00f7 P] \u00d7 (365 \u00f7 d)')+L('Calculation','[(100 \u2212 98.32) \u00f7 98.32] \u00d7 (365 \u00f7 100) = 0.017087 \u00d7 3.65 = 0.0624 = 6.24%')},
  {q:'b. Calculate its effective annual yield.', gq:calc(['r<sub>EFF</sub> = ( 1 + ( 100 − P ) ÷ P )<sup>(365/d)</sup> − 1 = ( 1 + ( 100 − ______ ) ÷ ______ )<sup>(365/____)</sup> − 1 = 0.____ = {{f0}}']), f:[{l:'Effective annual yield',a:6.38,u:'%',tol:.04}],
   s:L('Formula','Effective yield = (1 + (100 \u2212 P) \u00f7 P)^(365 \u00f7 d) \u2212 1')+L('Calculation','(1.017087)^3.65 \u2212 1 = 0.0638 = 6.38%')+L('Why it\u2019s higher','The effective yield compounds the 100-day return over the 3.65 periods in a year, instead of simply scaling it up')}
 ]},
{id:'haynes', w:7, t:'Haynes Bank: is a cash management offer worth accepting?', src:'Connect quiz, Module 7 Q4',
 g:`<p>Haynes Bank offers to reduce the collection time on your company\u2019s daily cash receipts by two days. The service costs $25,000 per year. Short-term money market rates average 8%, and anticipated annual sales are $45.625 million.</p>`,
 parts:[
  {q:'If you anticipate annual sales of $45.625 million, would you accept the bank\u2019s offer?', gq:wst(null,[
    ['Annual sales $45,625,000 ÷ 365 days = average daily sales','{{f0}}'],
    ['$________ daily receipts × 2 days speed up = funds freed up','{{f1}}'],
    ['Opportunity benefit (cost) of funds at:','8%'],
    ['Annual benefit: = Funds freed up × 8%','{{f2}}'],
    ['subtract: Annual new bank fee','$________'],
    ['Annual savings (cost) from the offer','{{f3}}']],[5]) +
   `<p class="note">Conclusion: accept the offer? {{f4}} — there are ____ incremental benefits compared to incremental fees.</p>`, f:[{l:'Average daily sales',a:125000,u:'$'},{l:'Funds freed up by the speedup',a:250000,u:'$'},{l:'Annual benefit at 8%',a:20000,u:'$'},{l:'Net annual savings (cost)',a:-5000,u:'$'},{l:'Accept the offer?',a:'No',choice:['Yes','No']}],
   s:L('Average daily sales','$45,625,000 \u00f7 365 = $125,000')+L('Funds freed up','$125,000 \u00d7 2 days = $250,000')+L('Annual benefit','$250,000 \u00d7 8% = $20,000')+L('Net savings','$20,000 \u2212 $25,000 fee = ($5,000)')+L('Conclusion','No: the $25,000 fee costs more than the $20,000 benefit, a net loss of $5,000 a year')}
 ]}
,
{id:'trade_credit8', w:8, t:'Trade credit: average accounts payable balance, and the effect of a sales expansion', src:'ICQ Module 8, worked example',
 g:`<p>If annual purchases of a company are $7.3 million and are paid on terms of net 30 days, the average accounts payable balance will be $_______.</p><p>An expansion in business, and thus purchases, by 20 percent to $8.76 million increases the accounts payable balance to $_______.</p>` +
 wst(['Annual Purchases','÷ Days per year','= Average Daily Purchases','× Accounts Payable Period','= Average A/P Balance','Increase in short term financing'],[
  ['$7,300,000','365','{{p0f0}}','____ days','{{p0f1}}',''],
  ['$8,760,000','365','{{p1f0}}','____ days','{{p1f1}}','{{p1f2}}']]) +
 `<p class="note">A/P period = Accounts payable ÷ Average daily purchases (COGS). Accounts Payable = Average Payables Period × Average Daily Purchases.</p>`,
 parts:[
  {q:'a. What is the average daily purchases, and the average accounts payable balance?', f:[{l:'Average daily purchases',a:20000,u:'$'},{l:'Average accounts payable balance',a:600000,u:'$'}],
   s:L('Average daily purchases','$7,300,000 \u00f7 365 = $20,000')+L('Average A/P balance','$20,000 \u00d7 30 days = $600,000')},
  {q:'b. Purchases expand by 20% to $8,760,000 (the payment period stays at 30 days). What is the new average accounts payable balance, and how much extra short-term financing does this provide?', f:[{l:'New average daily purchases',a:24000,u:'$'},{l:'New average A/P balance',a:720000,u:'$'},{l:'Increase in short-term financing',a:120000,u:'$'}],
   s:L('New average daily purchases','$8,760,000 \u00f7 365 = $24,000')+L('New average A/P balance','$24,000 \u00d7 30 days = $720,000')+L('Increase in financing','$720,000 \u2212 $600,000 = $120,000, and it arrives automatically as purchases grow')}
 ]},
{id:'cash_discount_ex', w:8, t:'Cost of forgoing a cash discount: 2/10, net 30', src:'ICQ Module 8, worked example',
 g:`<p>A cash discount allows for a reduction in price if payment is made within a specified time (e.g. 2/10, n 30). On a $1,000 invoice, we could pay $980 up to the 10th day or wait 20 more days and pay the full $1,000.</p>` +
 calc(['K<sub>DIS</sub> = d% ÷ ( 100% − d% ) × 365 ÷ ( f(date) − d(date) )',
       'K<sub>DIS</sub> = __% ÷ ( 100% − __% ) × 365 days ÷ ( __ days − __ days ) = {{p0f0}}']) +
 `<p class="note">Notice that we calculated the rate without the need for any specific data on the invoice $.</p>`,
 parts:[
  {q:'What is the annual cost of forgoing the discount (paying on day 30 instead of day 10)?', f:[{l:'Cost of forgoing the discount',a:37.24,u:'%',tol:.1}],
   s:L('Formula','K_DIS = [d% \u00f7 (100% \u2212 d%)] \u00d7 [365 \u00f7 (net days \u2212 discount days)]')+L('Calculation','[2% \u00f7 98%] \u00d7 [365 \u00f7 (30 \u2212 10)] = 0.0204 \u00d7 18.25 = 0.3724 = 37.24%')}
 ]},
{id:'promptly', w:8, t:'Paul Promptly: cost of not taking the cash discount, on his effective terms', src:'ICQ Module 8, Problem 4',
 g:`<ul><li>Paul Promptly is a very cautious businessman. His suppliers offer trade credit terms of 3/10, net 70.</li><li>Mr. Promptly never takes the discount offered, but he pays his suppliers in 60 days rather than the 70 days allowed so that he is sure the payments are never late.</li><li>What is Mr. Promptly’s cost of not taking the cash discount?</li></ul>` +
 calc(['K<sub>DIS</sub> = d% ÷ ( 100% − d% ) × 365 ÷ ( f(date) − d(date) )',
       'K<sub>DIS</sub> = __% ÷ ( 100% − __% ) × 365 ÷ ( __ − __ ) = {{p0f0}}']) +
 `<p class="note">In this problem, Mr. Promptly has the use of funds for only 50 extra days (60 − 10), instead of 60 extra days (70 − 10). His suppliers are offering terms of 3/10, net 70; however, because he is excessively cautious, he is in practical effect accepting terms of 3/10, net 60.</p>`,
 parts:[
  {q:'What is Mr. Promptly\u2019s cost of not taking the cash discount?', f:[{l:'Cost of forgoing the discount',a:22.58,u:'%',tol:.1}],
   s:L('Note','Because Mr. Promptly pays on day 60 instead of day 70, he only has the use of the funds for 50 extra days (60 \u2212 10), not 60 (70 \u2212 10) \u2014 so his effective terms are 3/10, net 60')+L('Formula','K_DIS = [d% \u00f7 (100% \u2212 d%)] \u00d7 [365 \u00f7 (effective net days \u2212 discount days)]')+L('Calculation','[3% \u00f7 97%] \u00d7 [365 \u00f7 (60 \u2212 10)] = 0.0309 \u00d7 7.30 = 0.2258 = 22.58%')}
 ]},
{id:'bautista', w:8, t:'Bautista Dog Food Company: net credit position', src:'ICQ Module 8, Problem 9',
 g:`<p>Bautista Dog Food Company normally takes 20 days to pay for average daily credit purchases of $9,000. Its average daily sales are $10,000 and it collects accounts in 25 days.</p><p>a. What is its net credit position?</p><p>b. If the firm stretches its average payment period from 20 days to 32 days (and all else remains the same), what is the firm’s new net credit position?</p>` +
 calc(['Accounts Receivable = Average daily credit sales × average collection period = $_______ × __ = {{p0f0}}',
       'Accounts Payable = Average daily credit purchases × average payment period = $______ × __ = {{p0f1}}',
       'Net credit position = Accounts receivable − Accounts payable = {{p0f2}}']),
 parts:[
  {q:'a. What is Bautista\u2019s net credit position?', f:[{l:'Accounts receivable',a:250000,u:'$'},{l:'Accounts payable',a:180000,u:'$'},{l:'Net credit position',a:70000,u:'$'}],
   s:L('Accounts receivable','$10,000 \u00d7 25 days = $250,000')+L('Accounts payable','$9,000 \u00d7 20 days = $180,000')+L('Net credit position','$250,000 \u2212 $180,000 = +$70,000 (Bautista extends more credit than it receives)')},
  {q:'b. If Bautista stretches its average payment period from 20 days to 32 days (everything else the same), what is the new net credit position?', f:[{l:'New accounts payable',a:288000,u:'$'},{l:'New net credit position',a:-38000,u:'$'}],
   s:L('Accounts receivable','Unchanged at $250,000')+L('New accounts payable','$9,000 \u00d7 32 days = $288,000')+L('New net credit position','$250,000 \u2212 $288,000 = ($38,000)')+L('Interpretation','Bautista has improved its cash position: instead of extending $70,000 more credit than it receives, it is now the net recipient of $38,000 in credit')}
 ]},
{id:'stephen_rate', w:8, t:'Stephen Corporation: cost of interest-bearing bank financing', src:'ICQ Module 8, worked example',
 g:`<p>For the next 90 days, Stephen Corporation has a short-term financing need for $100,000. The Chief Financial Officer of the corporation has negotiated a 90 day loan with $4,000 in interest for this loan.</p><p>Calculate the annual cost for the interest rate for this interest bearing bank financing.</p>` +
 calc(['R<sub>ANNUAL</sub> = I ÷ P × 365 ÷ d = $______ ÷ $________ × 365 ÷ __ = {{p0f0}}',
       'Interest Cost in $ = P × r × ( d ÷ 365 ) = $________ × ____ % × ( __ ÷ 365 ) = {{p1f0}}']),
 parts:[
  {q:'a. The CFO negotiates a 90-day loan with $4,000 in interest payments. What is the annual interest rate on this financing?', f:[{l:'Annual interest rate',a:16.22,u:'%',tol:.1}],
   s:L('Formula','R_ANNUAL = (Interest \u00f7 Principal) \u00d7 (365 \u00f7 Days)')+L('Calculation','($4,000 \u00f7 $100,000) \u00d7 (365 \u00f7 90) = 0.04 \u00d7 4.0556 = 0.1622 = 16.22%')},
  {q:'b. Instead, suppose the CFO negotiates a 90-day loan at a 16.22% annual interest rate. What is the dollar cost of interest for this loan?', f:[{l:'Interest cost',a:4000,u:'$',tol:5}],
   s:L('Formula','Interest cost ($) = Principal \u00d7 Rate \u00d7 (Days \u00f7 365)')+L('Calculation','$100,000 \u00d7 16.22% \u00d7 (90 \u00f7 365) = $3,999 \u2248 $4,000')}
 ]},
{id:'stephen_comp', w:8, t:'Stephen Corporation: compensating balance loan', src:'ICQ Module 8, worked example',
 g:`<p>For the next 1 year, Stephen Corporation has a short-term financing need for $8,000. The Chief Financial Officer of the corporation has negotiated a $10,000 loan with a 20% compensating balance requirement, and must pay $600 in interest for this loan.</p><p>What is the annual rate on this compensating balance loan? Use 365 days in a year. Do not round intermediate calculations. Round the final answer to 2 decimal places.</p>` +
 calc(['Amount to be borrowed = Amount needed ÷ ( 1 − c ) = {{p0f0}}',
       'Compensating balance required = Amount borrowed × c = {{p1f0}}',
       'R<sub>COMP</sub> = I ÷ ( P − B ) × 365 ÷ d = $____ ÷ ( $_______ − $______ ) × 365 ÷ 365 = {{p1f1}}',
       'or&nbsp; R<sub>COMP</sub> = I ÷ ( 1 − c ) × ( 1 ÷ 100 ) × ( 365 ÷ d )']),
 parts:[
  {q:'a. Confirm the amount that must actually be borrowed, so that $8,000 is left usable after the compensating balance is set aside.', f:[{l:'Amount to be borrowed',a:10000,u:'$'}],
   s:L('Formula','Amount to be borrowed = Amount needed \u00f7 (1 \u2212 compensating balance %)')+L('Calculation','$8,000 \u00f7 (1 \u2212 0.20) = $8,000 \u00f7 0.80 = $10,000')},
  {q:'b. What is the annual rate on this compensating balance loan?', f:[{l:'Compensating balance required',a:2000,u:'$'},{l:'Annual rate (R_COMP)',a:7.5,u:'%',tol:.1}],
   s:L('Compensating balance required','20% \u00d7 $10,000 = $2,000')+L('Formula','R_COMP = [Interest \u00f7 (Principal \u2212 Required balance)] \u00d7 (365 \u00f7 Days)')+L('Calculation','[$600 \u00f7 ($10,000 \u2212 $2,000)] \u00d7 (365 \u00f7 365) = 0.0750 = 7.50%')+L('Note','An equivalent algebraic form divides by (1 \u2212 c) instead of subtracting the balance directly \u2014 both give the same 7.50%')}
 ]},
{id:'stephen_discounted', w:8, t:'Stephen Corporation: discounted loan', src:'ICQ Module 8, worked example',
 g:`<p>For the next 60 days, Stephen Corporation has a short-term financing need for $35,000. The Chief Financial Officer of the corporation has negotiated to pay $310 in interest for this loan.</p><p>What is the annual rate of interest if the loan is discounted? Use 365 days in a year. Do not round intermediate calculations. Round the final answer to 2 decimal places.</p>` +
 calc(['Annual interest rate on discounted loan',
       'R<sub>DIS</sub> = I ÷ ( P − I ) × 365 ÷ d = $____ ÷ ( $_______ − $____ ) × 365 ÷ __ = {{p0f0}}']) +
 `<p class="note">Rate on discounted paper when we know the PRINCIPAL (borrowed amount), INTEREST PAYMENT and TIME PERIOD.</p>`,
 parts:[
  {q:'What is the annual rate of interest on this discounted loan?', f:[{l:'Annual rate (R_DIS)',a:5.44,u:'%',tol:.1}],
   s:L('Formula','R_DIS = [Interest \u00f7 (Principal \u2212 Interest)] \u00d7 (365 \u00f7 Days)')+L('Calculation','[$310 \u00f7 ($35,000 \u2212 $310)] \u00d7 (365 \u00f7 60) = 0.008934 \u00d7 6.0833 = 0.0544 = 5.44%')}
 ]},
{id:'chapman', w:8, t:'Chapman Records: yield on commercial paper sold at a discount', src:'ICQ Module 8, Problem 27',
 g:`<p>Chapman Records’ commercial paper is currently selling at 98.512 percent of maturity value; it matures in 75 days. What annualized yield is it offering to investors?</p><p class="note">Consider each $100 face or maturity value. The issuer receives (and investors pay) $98.512 today for every $100 of maturity value in 75 days from now.</p>` +
 calc(['Annualized yield on discounted paper',
       'R<sub>DIS</sub> = ( 100 − P ) ÷ P × 365 ÷ d = ( 100 − ______ ) ÷ ______ × 365 ÷ __ = {{p0f0}}',
       'Effective annual yield',
       'R<sub>EFF</sub> = [ 1 + ( 100 − P ) ÷ P ]<sup>(365/d)</sup> − 1 = {{p1f0}}']),
 parts:[
  {q:'a. What annualized yield is it offering investors?', f:[{l:'Annualized yield',a:7.35,u:'%',tol:.08}],
   s:L('Formula','r = [(100 \u2212 P) \u00f7 P] \u00d7 (365 \u00f7 d)')+L('Calculation','[(100 \u2212 98.512) \u00f7 98.512] \u00d7 (365 \u00f7 75) = 0.015102 \u00d7 4.8667 = 0.0735 = 7.35%')},
  {q:'b. What is the effective annual yield?', f:[{l:'Effective annual yield',a:7.57,u:'%',tol:.08}],
   s:L('Formula','r_EFF = (1 + (100 \u2212 P) \u00f7 P)^(365 \u00f7 d) \u2212 1')+L('Calculation','(1.015102)^4.8667 \u2212 1 = 0.0757 = 7.57%')}
 ]},
{id:'rockford', w:8, t:'Rockford Filing Ltd.: choosing the cheapest short-term financing alternative', src:'ICQ Module 8, Problem 35',
 g:`<p>Rockford Filing Ltd. requires $1 million in financing for a 45-day period. Three alternatives are being considered. Which alternative should be selected?</p><ul><li>a. Establish a line of credit with the bank at an interest rate of 10 percent. The bank will charge an annual commitment fee of 1 percent to establish the line of credit.</li><li>b. Forgo trade discounts from suppliers on terms of 2/15, net 60.</li><li>c. Issue commercial paper for 45 days at a discount of 1.25 percent.</li></ul>` +
 wst(['Which formulas do we need? Compare annualized rate (not “effective” annualized)','Part'],[
  ['Actual $ cost of interest bearing bank financing (loans), in dollars:&nbsp; Interest Cost in $ = P × r × ( d ÷ 365 )','a'],
  ['Annual cost of interest bearing bank financing (loans), in percent:&nbsp; R<sub>ANNUAL</sub> = I ÷ P × ( 365 ÷ d )','a'],
  ['Annual cost of forgoing an early pay cash discount on an invoice:&nbsp; K<sub>DIS</sub> = d% ÷ ( 100% − d% ) × 365 ÷ ( f(date) − d(date) )','b'],
  ['Annual return (yield) on securities sold at a discount:&nbsp; R<sub>DIS</sub> = ( 100 − P ) ÷ P × ( 365 ÷ d )','c']]) +
 wst(['Part','Cost'],[
  ['(a) Line of Credit including commitment fee','____ %'],
  ['(b) Forgo trade discounts from suppliers','____ %'],
  ['(c) Issue commercial paper','____ %']]) +
 `<p class="note">CONCLUSION: Choose the {{p3f0}} — it is the cheapest alternative.</p>`,
 parts:[
  {q:'a. What is the annual rate of interest on the line of credit, including the commitment fee?', gq:calc([
    'Annual commitment fee = 1% × $________ = {{f0}}',
    'Interest expense = $________ × 10 % × ( ____ ÷ 365 ) = {{f1}}',
    'Annual rate of interest: R<sub>ANNUAL</sub> = I ÷ P × 365 ÷ d = ( $________ + $________ )* ÷ $________ × 365 ÷ ____ = 0.____ = {{f2}}']) +
   `<p class="note">* Note: the interest cost also includes the commitment fee.</p>`, f:[{l:'Annual commitment fee',a:10000,u:'$'},{l:'Interest expense',a:12328.77,u:'$',tol:5},{l:'Annual rate of interest',a:18.11,u:'%',tol:.1}],
   s:L('Commitment fee','1% \u00d7 $1,000,000 = $10,000')+L('Interest expense','$1,000,000 \u00d7 10% \u00d7 (45 \u00f7 365) = $12,328.77')+L('Formula','R_ANNUAL = [(Commitment fee + Interest expense) \u00f7 Principal] \u00d7 (365 \u00f7 Days)')+L('Calculation','[($10,000 + $12,328.77) \u00f7 $1,000,000] \u00d7 (365 \u00f7 45) = 0.1811 = 18.11%')},
  {q:'b. What is the cost of forgoing the cash discount on terms of 2/15, net 60?', gq:calc(['K<sub>DIS</sub> = d% ÷ ( 100% − d% ) × 365 ÷ ( f(date) − d(date) ) = __% ÷ ( 100% − __% ) × 365 ÷ ( ___ − ___ ) = 0.____ = {{f0}}']), f:[{l:'Cost of forgoing the discount',a:16.55,u:'%',tol:.1}],
   s:L('Formula','K_DIS = [d% \u00f7 (100% \u2212 d%)] \u00d7 [365 \u00f7 (net days \u2212 discount days)]')+L('Calculation','[2% \u00f7 98%] \u00d7 [365 \u00f7 (60 \u2212 15)] = 0.1655 = 16.55%')},
  {q:'c. The commercial paper sells at a discount of 1.25% (so its price is 100 \u2212 1.25 = 98.75, per $100 of maturity value). What annualized rate does this represent?', gq:calc(['Students: the commercial paper sells “at a discount of 1.25 percent”, so the Price “P” is ( 100 − 1.25 ) = ______',
         'r = ( 100 − P ) ÷ P × 365 ÷ d = ( 100 − ______ ) ÷ ______ × 365 ÷ ____ = 0.____ = {{f0}}']), f:[{l:'Annualized rate',a:10.27,u:'%',tol:.1}],
   s:L('Price','100 \u2212 1.25 = 98.75')+L('Formula','r = [(100 \u2212 P) \u00f7 P] \u00d7 (365 \u00f7 d)')+L('Calculation','[(100 \u2212 98.75) \u00f7 98.75] \u00d7 (365 \u00f7 45) = 0.1027 = 10.27%')},
  {q:'d. Which alternative should Rockford choose?', f:[{l:'Cheapest alternative',a:'Commercial paper',choice:['Line of credit','Forgo the cash discount','Commercial paper']}],
   s:L('Compare','(a) 18.11% vs. (b) 16.55% vs. (c) 10.27%')+L('Conclusion','Choose the commercial paper \u2014 it is the cheapest alternative')}
 ]}
,
{id:'macco', w:8, t:'Macco Bakers: choosing the cheapest short-term financing alternative', src:'Connect quiz, Module 8 Q1',
 g:`<p>Macco Bakers requires $500,000 in financing for a 90-day period. Three alternatives are being considered:</p><ul><li>(a) A line of credit at 8% interest; the bank charges a flat $5,000 fee to establish the line.</li><li>(b) Forgo trade discounts from suppliers on terms of 2/10, net 100.</li><li>(c) Issue commercial paper for 90 days at a discount of 2.05%.</li></ul><p>Use 365 days in a year; do not round intermediate calculations; round final answers to 2 decimal places.</p>` +
 wst(['Part','Cost'],[['(a) Line of credit including the fee','____ %'],['(b) Forgo trade discounts from suppliers','____ %'],['(c) Issue commercial paper','____ %']]) +
 `<p class="note">CONCLUSION: Choose the {{p3f0}}. It is the cheapest alternative.</p>`,

   `<p class="note">* Note: the interest cost also includes the fee.</p>`, f:[{l:'Rate of interest for bank loan',a:12.06,u:'%',tol:.1}],

  {q:'b. What would be the cost of forgoing the cash discount?', gq:calc(['K<sub>DIS</sub> = d% ÷ ( 100% − d% ) × 365 ÷ ( f(date) − d(date) ) = __% ÷ ( 100% − __% ) × 365 ÷ ( ___ − ___ ) = 0.____ = {{f0}}']), f:[{l:'Cost of forgoing the cash discount',a:8.28,u:'%',tol:.1}],

  {q:'d. Which alternative should be selected?', f:[{l:'Cheapest alternative',a:'Cost of forgoing discount',choice:['Bank loan','Cost of forgoing discount','Commerical paper']}],
   s:L('Compare','(a) 12.06% vs. (b) 8.28% vs. (c) 8.49%')+L('Conclusion','Choose to forgo the cash discount \u2014 it is the cheapest of the three, just ahead of the commercial paper')}
