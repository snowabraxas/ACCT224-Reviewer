/* ---------- answer checking ---------- */
function parseNum(s){
  if(s==null) return NaN;
  let t=String(s).trim().toLowerCase();
  if(!t) return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(t)){ neg=true; t=t.slice(1,-1); }
  t=t.replace(/[$,\s×x%]|days?|units?|orders?|times|m$/g,'').replace(/[–−]/g,'-');
  if(t.startsWith('(')&&t.endsWith(')')){neg=true;t=t.slice(1,-1);}
  const v=Number(t);
  return isNaN(v)?NaN:(neg?-Math.abs(v):v);
}
function defTol(f){
  if(f.tol!=null) return f.tol;
  const a=Math.abs(f.a);
  switch(f.u){
    case '$': return a<100 ? .01 : Math.max(1, a*0.0006);
    case '%': return .06;
    case 'x': return .051;
    case 'days': return .6;
    case 'units': return .5;
    case 'orders': return .5;
    default: return Math.max(.01, a*.005);
  }
}
function isRight(f, raw){
  if(f.choice) return raw===f.a;
  let v=parseNum(raw); if(isNaN(v)) return null;
  const tol=defTol(f);
  if(Math.abs(v-f.a)<=tol) return true;
  if(f.u==='%' && Math.abs(v*100-f.a)<=tol) return true;
  return false;
}
const fmt = f => {
  if(f.choice) return f.a;
  const a=f.a, abs=Math.abs(a);
  let s = abs>=1000 ? abs.toLocaleString('en-US',{maximumFractionDigits:0}) : String(+abs.toFixed(2));
  if(f.u==='$'||f.u==='$M') s='$'+s;
  if(f.u==='$M') s+=' million';
  if(f.u==='%') s+='%';
  if(f.u==='x') s+='×';
  if(f.u==='days') s+=' days';
  if(f.u==='units') s+=' units';
  if(f.u==='orders') s+=' orders';
  return a<0 ? '('+s+')' : s;
};
const pre = u => (u==='$'||u==='$M')?'$':'';
const suf = u => ({'%':'%','x':'×','days':'days','units':'units','orders':'orders','$M':'M'})[u]||'';

function shuffle(){
  const pool=P.filter(p=>st.mixWeeks.has(p.w) && (!st.flagOnly || isFlagged(p)));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  st.mixOrder=pool.map(p=>p.id); st.mixPos=0;
}
function persistUI(){ store._ui={idx:st.idx,week:st.week}; save(); }

function fieldHTML(p,pi,fi,f){
  const id=fid(p,pi,fi), rec=store[id]||{}, cls=rec.ok===true?'ok':(rec.ok===false?'bad':'');
  const v = rec.v!=null?rec.v:'';
  let ctrl;
  if(f.choice){
    ctrl=`<select id="${id}" data-f="${id}"><option value="">Choose…</option>${f.choice.map(c=>`<option ${v===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  } else {
    ctrl=(pre(f.u)?`<span>${pre(f.u)}</span>`:'')+`<input id="${id}" data-f="${id}" inputmode="decimal" autocomplete="off" value="${esc(v)}">`+(suf(f.u)?`<span>${suf(f.u)}</span>`:'');
  }
  const fb = rec.ok===true?'Correct':(rec.ok===false?(rec.shown?'Answer: '+fmt(f):'Not quite, try again'):'');
  return `<div class="fld ${cls}" data-wrap="${id}"><label for="${id}">${esc(f.l)}</label><div class="inp">${ctrl}</div><div class="fb" aria-live="polite">${fb}</div></div>`;
}

const FTOK = /\{\{(?:p(\d+))?f(\d+)\}\}/g;
function inlineFieldHTML(p,pi,fi,f){
  const id=fid(p,pi,fi), rec=store[id]||{}, cls=rec.ok===true?'ok':(rec.ok===false?'bad':'');
  const v = rec.v!=null?rec.v:'';
  let ctrl;
  if(f.choice){
    ctrl=`<select id="${id}" data-f="${id}" aria-label="${esc(f.l)}"><option value="">Choose\u2026</option>${f.choice.map(c=>`<option ${v===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
  } else {
    ctrl=(pre(f.u)?`<span>${pre(f.u)}</span>`:'')+`<input id="${id}" data-f="${id}" inputmode="decimal" autocomplete="off" aria-label="${esc(f.l)}" value="${esc(v)}">`+(suf(f.u)?`<span>${suf(f.u)}</span>`:'');
  }
  const fb = rec.ok===true?'Correct':(rec.ok===false?(rec.shown?'Answer: '+fmt(f):'Not quite'):'');
  return `<span class="fld fldin ${cls}" data-wrap="${id}"><span class="inp">${ctrl}</span><span class="fb" aria-live="polite">${fb}</span></span>`;
}
function injectFields(html,p,piCtx){
  if(!html) return html||'';
  return String(html).replace(FTOK,(m,pp,ff)=>{
    const pi = pp!==undefined ? +pp : piCtx, fi=+ff;
    const pt=p.parts[pi]; if(!pt) return m;
    const f=pt.f[fi]; if(!f) return m;
    return inlineFieldHTML(p,pi,fi,f);
  });
}
function usedFields(p){
  const set=new Set();
  const scan=(html,piCtx)=>{
    if(!html) return;
    const re=new RegExp(FTOK.source,'g'); let m;
    while((m=re.exec(String(html)))) set.add(((m[1]!==undefined)?+m[1]:piCtx)+':'+(+m[2]));
  };
  scan(p.g,0);
  p.parts.forEach((pt,pi)=>scan(pt.gq,pi));
  return set;
}
function problemHTML(p, ctx){
  const w=WEEKS[p.w];
  let h=`<div class="phead"><span class="tag">${w.name}: ${w.topic}</span><span class="src">${p.src}</span>${p.extra?'<span class="xtag">Not on the midterm</span>':''}<button class="flag notebtn" data-notebtn aria-expanded="${!!getNote(p)}">\u270E ${getNote(p)?'My note':'Add note'}</button><button class="flag" data-flag aria-pressed="${isFlagged(p)}">${isFlagged(p)?'\u2691 Marked for review':'\u2690 Review again later'}</button></div><h2>${p.t}</h2>`;
  h+=`<div class="note-area" id="na-${p.id}" ${getNote(p)?'':'hidden'}><label for="nt-${p.id}">My notes: what is tripping me up</label><textarea id="nt-${p.id}" data-note rows="3" placeholder="e.g. I keep forgetting that a decrease in a liability uses cash">${esc(getNote(p))}</textarea><div class="note-saved" aria-live="polite"></div></div>`;
  const used = usedFields(p);
  h+=`<div class="given">${injectFields(p.g,p,0)}</div><div class="parts">`;
  p.parts.forEach((pt,pi)=>{
    h+=`<section class="part" data-p="${pi}"><p class="q">${p.parts.length>1?`<b class="pl">Part ${pi+1}</b>`:''}${pt.q}</p>
    ${pt.gq?`<div class="given partgiven">${injectFields(pt.gq,p,pi)}</div>`:''}
    <div class="fields">${pt.f.map((f,fi)=>used.has(pi+':'+fi)?'':fieldHTML(p,pi,fi,f)).join('')}</div>
    <div class="acts"><button class="btn" data-check="${pi}">Check</button><button class="btn2" data-fx="${pi}" aria-expanded="false">Show formulas</button><button class="btn2" data-steps="${pi}" aria-expanded="false">Show steps</button><button class="btn2" data-reveal="${pi}">Reveal answers</button><button class="btn2" data-clear="${pi}">Clear</button></div>
    <div class="fx" id="fx-${p.id}-${pi}">${fxHTML(p,pi)}</div><div class="steps" id="steps-${p.id}-${pi}">${pt.s}</div></section>`;
  });
  h+='</div>';
  return h;
}

function render(){
  $('#mWeek').setAttribute('aria-pressed', st.mode==='week');
  $('#mMix').setAttribute('aria-pressed', st.mode==='mix');
  $('#weekUI').hidden = st.mode!=='week';
  $('#mixUI').hidden = st.mode!=='mix';
  let p, nav='', foot='';
  if(st.mode==='week'){
    renderTestSeg();
    renderTabs();
    renderOverview();
    sheet.classList.remove('mixed');
    const list=byWeek(st.week);
    const i=Math.min(st.idx[st.week]||0, list.length-1);
    p=list[i];
    nav=`<nav class="pnav" aria-label="${WEEKS[st.week].name} problems">`+list.map((q,k)=>{
      const s=probScore(q); const c=s.ok===s.n?'done':(s.ok>0?'part':'');
      return `<button class="pn ${c}${q.id.startsWith('q-')?' qz':''}${isFlagged(q)?' fl':''}${getNote(q).trim()?' nt':''}" data-k="${k}" aria-current="${k===i}" title="${esc(q.t)}">${k+1}</button>`;
    }).join('')+`<span class="legend">Solid: in-class question &nbsp; Dashed: Connect quiz &nbsp; \u2691 Review again later &nbsp; \u270E Has a note</span></nav>`;
    const flat=WEEK_NUMS.flatMap(w=>byWeek(w).map((q,k)=>({w,k})));
    const g=flat.findIndex(x=>x.w===st.week&&x.k===i);
    const prev=flat[g-1], next=flat[g+1];
    foot=`<div class="foot"><button class="btn2" id="prev" ${prev?'':'disabled'}>${prev&&prev.w!==st.week?'Back to '+WEEKS[prev.w].name:'Previous problem'}</button><button class="btn" id="next" ${next?'':'disabled'}>${next&&next.w!==st.week?'Continue to '+WEEKS[next.w].name:'Next problem'}</button></div>`;
    sheet.setAttribute('style', wvar(p.w));
    sheet.innerHTML = nav + problemHTML(p) + foot;
    sheet.querySelectorAll('.pn').forEach(b=>b.onclick=()=>{ st.idx[st.week]=+b.dataset.k; persistUI(); render(); window.scrollTo({top:0}); });
    const go=t=>{ if(!t) return; st.week=t.w; st.test=testOf(t.w); st.idx[t.w]=t.k; persistUI(); render(); window.scrollTo({top:0}); };
    $('#prev').onclick=()=>go(prev); $('#next').onclick=()=>go(next);
  } else {
    renderChips();
    sheet.classList.add('mixed');
    if(!st.mixOrder.length){
      sheet.setAttribute('style','');
      sheet.innerHTML = st.flagOnly ? `<div class="empty">No problems marked for review in the selected weeks yet. Use \u201cReview again later\u201d on any problem to add it here.</div>` : `<div class="empty">Pick at least one week above to build a mixed set.</div>`;
      updateOverall(); return;
    }
    p=P.find(q=>q.id===st.mixOrder[st.mixPos]);
    const n=st.mixOrder.length;
    nav=`<p class="count" style="margin:0 0 10px">Problem ${st.mixPos+1} of ${n}</p>`;
    foot=`<div class="foot"><button class="btn2" id="prev" ${st.mixPos>0?'':'disabled'}>Previous problem</button><button class="btn" id="next">${st.mixPos<n-1?'Next problem':'Shuffle a new set'}</button></div>`;
    sheet.setAttribute('style', wvar(p.w));
    sheet.innerHTML = nav + problemHTML(p) + foot;
    $('#prev').onclick=()=>{ st.mixPos--; render(); window.scrollTo({top:0}); };
    $('#next').onclick=()=>{ if(st.mixPos<n-1) st.mixPos++; else shuffle(); render(); window.scrollTo({top:0}); };
  }
  wire(p);
  updateOverall();
}

function setField(p,pi,fi,res,raw,shown){
  const f=p.parts[pi].f[fi], id=fid(p,pi,fi);
  const wrap=sheet.querySelector(`[data-wrap="${id}"]`);
  wrap.classList.remove('ok','bad');
  const fb=wrap.querySelector('.fb');
  if(res===null||raw===''){ delete store[id]; fb.textContent=''; return; }
  store[id]={v:raw, ok:res, shown:!!shown};
  wrap.classList.add(res?'ok':'bad');
  fb.textContent = res?'Correct':(shown?'Answer: '+fmt(f):'Not quite, try again');
}

function mathifyDom(p){
  if(!TESTS[2].weeks.includes(p.w)) return;
  sheet.querySelectorAll('.fx .ln > b, .steps .ln > b').forEach(el=>{ el.innerHTML = mxPrep(el.innerHTML); });
  sheet.querySelectorAll('.fx .ln > span, .steps .ln > span, .steps .note, .given .note').forEach(el=>{
    if(el.querySelector('input,select,.mx')) return;
    const h = el.innerHTML, m = mathify(h);
    if(m !== h) el.innerHTML = m;
  });
}
function activateBlanks(p){
  let k = 0;
  sheet.querySelectorAll('.given').forEach(box=>{
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, null);
    const todo = [];
    while(walker.nextNode()){ if(/_{2,}/.test(walker.currentNode.nodeValue)) todo.push(walker.currentNode); }
    todo.forEach(node=>{
      const frag = document.createDocumentFragment();
      node.nodeValue.split(/(_{2,})/).forEach(seg=>{
        if(/^_{2,}$/.test(seg)){
          const id = 'sc-' + p.id + '-' + (k++);
          const inp = document.createElement('input');
          inp.type = 'text';
          inp.className = 'scratch';
          inp.id = id;
          inp.placeholder = ' ';
          inp.setAttribute('data-scratch','');
          inp.setAttribute('aria-label','Working space, not marked');
          inp.size = Math.max(4, Math.min(11, seg.length));
          const v = store[id];
          if(typeof v === 'string') inp.value = v;
          inp.addEventListener('input',()=>{
            const t = inp.value;
            if(t.trim()) store[id] = t; else delete store[id];
            save();
          });
          frag.appendChild(inp);
        } else if(seg){
          frag.appendChild(document.createTextNode(seg));
        }
      });
      node.parentNode.replaceChild(frag, node);
    });
  });
}
function wire(p){
  const nb=sheet.querySelector('[data-notebtn]'), na=document.getElementById('na-'+p.id), ta=document.getElementById('nt-'+p.id);
  if(nb) nb.onclick=()=>{
    const show=na.hidden; na.hidden=!show; nb.setAttribute('aria-expanded',show);
    if(show) ta.focus();
  };
  let tmr;
  if(ta) ta.addEventListener('input',()=>{
    store._notes=store._notes||{};
    const v=ta.value;
    if(v.trim()) store._notes[p.id]=v; else delete store._notes[p.id];
    save();
    nb.textContent='\u270E '+(v.trim()?'My note':'Add note');
    const cur=sheet.querySelector('.pn[aria-current="true"]'); if(cur) cur.classList.toggle('nt',!!v.trim());
    updateNotesBtn();
    const s=na.querySelector('.note-saved'); s.textContent='Saving\u2026'; clearTimeout(tmr); tmr=setTimeout(()=>{s.textContent='Saved';},500);
  });
  const fb=sheet.querySelector('[data-flag]');
  if(fb) fb.onclick=()=>{
    store._flags=store._flags||{};
    if(store._flags[p.id]) delete store._flags[p.id]; else store._flags[p.id]=true;
    save();
    const on=isFlagged(p);
    fb.setAttribute('aria-pressed',on); fb.textContent=on?'\u2691 Marked for review':'\u2690 Review again later';
    if(st.mode==='week'){ const b=sheet.querySelector('.pn[aria-current="true"]'); if(b) b.classList.toggle('fl',on); }
    else { const c=document.querySelector('.flagchip'); if(c) c.textContent='\u2691 Marked for review only ('+flagCount()+')'; }
  };
  sheet.querySelectorAll('[data-f]').forEach(el=>{
    el.addEventListener('keydown',e=>{ if(e.key!=='Enter') return;
      const seg=String(el.id).split('-'); seg.pop(); const piN=parseInt(seg.pop(),10);
      const host=el.closest('.part');
      const pi = Number.isFinite(piN) ? piN : (host?+host.dataset.p:0);
      check(p,pi); });
  });
  mathifyDom(p);
  activateBlanks(p);
  sheet.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>check(p,+b.dataset.check));
  sheet.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById(`fx-${p.id}-${b.dataset.fx}`);
    const open=el.classList.toggle('open'); b.textContent=open?'Hide formulas':'Show formulas'; b.setAttribute('aria-expanded',open);
  });
  sheet.querySelectorAll('[data-steps]').forEach(b=>b.onclick=()=>{
    const el=document.getElementById(`steps-${p.id}-${b.dataset.steps}`);
    const open=el.classList.toggle('open'); b.textContent=open?'Hide steps':'Show steps'; b.setAttribute('aria-expanded',open);
  });
  sheet.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>{
    const pi=+b.dataset.reveal;
    p.parts[pi].f.forEach((f,fi)=>{
      const el=document.getElementById(fid(p,pi,fi));
      const raw=el.value.trim();
      const r=raw===''?null:isRight(f,raw);
      if(r===true) return;
      el.value = f.choice? f.a : fmt(f).replace(/[$×%]| million| days| units/g,'');
      setField(p,pi,fi,false,el.value,true);
    });
    save(); refreshProgress();
  });
  sheet.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{
    const pi=+b.dataset.clear;
    p.parts[pi].f.forEach((f,fi)=>{ document.getElementById(fid(p,pi,fi)).value=''; setField(p,pi,fi,null,''); });
    const host=b.closest('.part');
    if(host) host.querySelectorAll('[data-scratch]').forEach(el=>{ el.value=''; delete store[el.id]; });
    save(); refreshProgress();
  });
}
function check(p,pi){
  p.parts[pi].f.forEach((f,fi)=>{
    const el=document.getElementById(fid(p,pi,fi));
    const raw=el.value.trim();
    const prevShown = store[fid(p,pi,fi)]&&store[fid(p,pi,fi)].shown && store[fid(p,pi,fi)].v===raw;
    setField(p,pi,fi, raw===''?null:isRight(f,raw), raw, prevShown);
  });
  save(); refreshProgress();
}
function refreshProgress(){
  if(st.mode==='week'){
    renderTabs();
    const list=byWeek(st.week);
    sheet.querySelectorAll('.pn').forEach((b,k)=>{ const s=probScore(list[k]); b.classList.toggle('done',s.ok===s.n); b.classList.toggle('part',s.ok>0&&s.ok<s.n); });
  }
  updateOverall();
}
function updateOverall(){
  const t=WEEK_NUMS.reduce((a,w)=>{const s=weekScore(w);a.ok+=s.ok;a.n+=s.n;return a;},{ok:0,n:0});
  $('#overall').textContent=`${t.ok} of ${t.n} answer fields correct across ${P.length} problems.`;
}

$('#mWeek').onclick=()=>{ st.mode='week'; render(); };
$('#mMix').onclick=()=>{ st.mode='mix'; if(!st.mixOrder.length) shuffle(); render(); };
$('#shuffle').onclick=()=>{ shuffle(); render(); };
function updateNotesBtn(){
  const n=noteCount();
  $('#notesBtn').textContent='My notes'+(n?' ('+n+')':'');
  if(!$('#notesPanel').hidden) renderNotes();
}
function renderNotes(){
  const list=WEEK_NUMS.flatMap(w=>byWeek(w).map((q,k)=>({q,k}))).filter(x=>getNote(x.q).trim());
  let h='<h3>My notes</h3><p class="count">Everything you\u2019ve written about what trips you up, in course order. Start your next review here.</p>';
  if(!list.length) h+='<p class="count">No notes yet. Use \u201c\u270E Add note\u201d on any problem.</p>';
  h+=list.map(({q,k})=>`<div class="ni" style="${wvar(q.w)}"><div class="nt-head"><span class="tag">${WEEKS[q.w].name}</span><b>${q.t}</b>${isFlagged(q)?'<span class="src">\u2691 marked</span>':''}</div><p class="nt-text">${esc(getNote(q))}</p><button class="btn2" data-go="${q.w}-${k}">Go to problem</button></div>`).join('');
  $('#notesPanel').innerHTML=h;
  $('#notesPanel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
    const [w,k]=b.dataset.go.split('-').map(Number);
    st.mode='week'; st.week=w; st.test=testOf(w); st.idx[w]=k; persistUI();
    $('#notesPanel').hidden=true; $('#notesBtn').setAttribute('aria-expanded',false);
    render(); sheet.scrollIntoView({block:'start'});
  });
}
$('#notesBtn').onclick=()=>{
  const p=$('#notesPanel'); p.hidden=!p.hidden; $('#notesBtn').setAttribute('aria-expanded',!p.hidden);
  if(!p.hidden) renderNotes();
};
updateNotesBtn();
$('#reset').onclick=()=>{ if(confirm('Clear all saved answers and progress?')){ store={}; save(); render(); } };
render();
setSync('Saved in this browser, on this device.');
</script>
